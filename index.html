<script>
/* ═══ MULTI-VIEW STATE ═══ */
function mkView(sampleCases,sampleTips,sampleQs,sampleKudos){
  return {cases:sampleCases||[],tips:sampleTips||[],customQs:sampleQs||[],scores:[],kudos:sampleKudos||[],
    sel:null,quiz:{on:false,i:0,ans:[],score:0,done:false},qList:[],
    fWeek:'All',fTopic:'All',fKeyword:'',tipCat:'All',tipWeekF:'All',tipKeyword:'',
    expandedTip:null,expandedScore:null,completedWeeks:{},
    adminSub:'cases',adminCaseWeek:'All',adminTipWeek:'All',adminQWeek:'All',
    showAddCase:false,showAddTip:false,showAddQ:false,showAddKudos:false,
    editQIdx:null,editingCase:null,editingTip:null,editingKudos:null,
    undoCases:[],undoTips:[],undoQs:[],undoKudos:[],
    _prefillCaseWeek:'',_prefillTipWeek:'',_qFormAns:0,_importTarget:'',
    _ncImgData:'',_ncVidData:'',_ntImgData:'',_ntVidData:'',
    reminder:'Check seller name before applying SOP. Read buyer remarks fully. Validate evidence before requesting more.',
  };
}

const S = {
  view: 'dms',
  tab: 'dashboard',
  dms: mkView([],[],[],[]),
  l2rr: mkView([],[],[],[]),
  p1: mkView([],[],[],[]),
};

/* ═══ HELPERS ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function V(){return S[S.view];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function groupByWeek(arr){const m={};arr.forEach(c=>{const w=c.week||'Unassigned';if(!m[w])m[w]=[];m[w].push(c);});return Object.entries(m);}
function uv(arr,key){return[...new Set(arr.map(a=>a[key]).filter(Boolean))];}
function countBy(arr,key){const m={};arr.forEach(a=>{const v=a[key];m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function toast(msg,type){const t=$('toast');t.textContent=msg;t.style.background=type==='error'?'#DC2626':'#059669';t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
function badge(text,color,bg){return `<span class="badge" style="color:${color};background:${bg}">${esc(text)}</span>`;}
function dd(id,value,options,ph,onchange){return `<select class="inp" style="width:auto;min-width:130px" id="${id}" onchange="${onchange}"><option value="All">${ph||'All'}</option>${options.filter(o=>o!=='All').map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function weekBtn(w,fn){return `<div style="margin-left:auto"><button style="padding:4px 12px;border-radius:6px;border:1px solid #EE4D2D;background:#FFF5F2;color:#EE4D2D;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="${fn}">+ Add to ${esc(w)}</button></div>`;}

const VER='v14';

/* ═══ USERNAME ═══ */
var _currentUsername = '';
function loadUsername(){
  try{ _currentUsername = localStorage.getItem('wj_username')||''; }catch(e){}
  updateSidebarUsername();
}
function updateSidebarUsername(){
  const el = document.getElementById('sidebar-username');
  if(el){ if(_currentUsername){ el.textContent='👤 '+_currentUsername; el.style.display='block'; } else { el.style.display='none'; } }
}
function showUsernameModal(pendingWeek){
  const modal = document.getElementById('username-modal');
  if(modal){ modal.style.display='flex'; modal._pendingWeek=pendingWeek||''; }
  setTimeout(()=>{ const inp=document.getElementById('username-input'); if(inp){ inp.value=_currentUsername||''; inp.focus(); } },50);
}
function confirmUsername(){
  const inp = document.getElementById('username-input');
  const name = (inp?inp.value:'').trim();
  if(!name){ inp&&inp.focus(); return; }
  _currentUsername = name;
  try{ localStorage.setItem('wj_username', name); }catch(e){}
  updateSidebarUsername();
  const modal = document.getElementById('username-modal');
  const pendingWeek = modal?modal._pendingWeek:'';
  if(modal) modal.style.display='none';
  _doStartQuiz(pendingWeek);
}

/* ═══ FIREBASE CONFIG — REPLACE WITH YOUR OWN ═══
   Steps:
   1. Go to https://console.firebase.google.com
   2. Create a project → Add a web app → copy the firebaseConfig object
   3. Go to Realtime Database → Create database → Start in TEST MODE
   4. Paste your values below
   ════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAB8uxu0TQlrV0LBvH7-FgWFsKxPni5Qv8",
  authDomain:        "wj-dashboard.firebaseapp.com",
  databaseURL:       "Phttps://wj-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "wj-dashboard",
  storageBucket:     "wj-dashboard.firebasestorage.app",
  messagingSenderId: "653380094253",
  appId:             "1:653380094253:web:e2ebc39383505a1ffbaba4"
};

/* ═══ FIREBASE ENGINE ═══ */
var _fbReady = false;
var _fbDB = null;
var _fbListeners = {}; // active realtime listeners

function fbConfigured(){
  return FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('PASTE_YOUR');
}

function fbStatus(state){
  const el=document.getElementById('fb-status');
  const txt=document.getElementById('fb-status-text');
  if(!el||!txt)return;
  const map={ok:['#ECFDF5','#059669','🟢 Synced'],err:['#FEF2F2','#DC2626','🔴 Not connected'],warn:['#FEF3C7','#D97706','🟡 Connecting…'],local:['#F3F4F6','#6B7280','⚫ Local only']};
  const [bg,col,label]=map[state]||map.warn;
  el.style.background=bg;el.style.color=col;txt.textContent=label;
  el.querySelector('span').style.background=col;
}

function initFirebase(){
  if(!fbConfigured()){
    console.warn('Firebase not configured — running in local-only mode.');
    fbStatus('local');
    render();
    return;
  }
  // Dynamically load Firebase SDK (compat v9)
  const sdks = [
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
  ];
  let loaded = 0;
  sdks.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => { loaded++; if(loaded === sdks.length) onFirebaseLoaded(); };
    s.onerror = () => { console.error('Failed to load Firebase SDK'); render(); };
    document.head.appendChild(s);
  });
}

function onFirebaseLoaded(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _fbDB = firebase.database();
    _fbReady = true;
    fbStatus('warn');
    loadAllFromFirebase();
  }catch(e){
    console.error('Firebase init error:', e);
    fbStatus('err');
    render();
  }
}

function fbPath(view, field){
  return 'wjdashboard/' + view + '/' + field;
}

/* Load all views from Firebase, then subscribe to live updates */
function loadAllFromFirebase(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder'];
  let pending = views.length * fields.length;

  views.forEach(v => {
    fields.forEach(f => {
      const ref = _fbDB.ref(fbPath(v, f));
      // One-time read first to hydrate state
      ref.once('value', snap => {
        const val = snap.val();
        if(val !== null){
          if(f === 'reminder'){ S[v].reminder = val; }
          else { S[v][f] = Array.isArray(val) ? val : Object.values(val || {}); }
        }
        pending--;
        if(pending === 0){ render(); fbStatus('ok'); subscribeAll(); }
      }, () => { pending--; if(pending===0){ render(); fbStatus('ok'); subscribeAll(); } });
    });
  });
}

/* Live listeners — update state & re-render when another user changes data */
function subscribeAll(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder'];
  views.forEach(v => {
    fields.forEach(f => {
      const key = v+':'+f;
      if(_fbListeners[key]) return; // already subscribed
      const ref = _fbDB.ref(fbPath(v, f));
      _fbListeners[key] = ref.on('value', snap => {
        const val = snap.val();
        if(f === 'reminder'){ S[v].reminder = val || S[v].reminder; }
        else { S[v][f] = val ? (Array.isArray(val) ? val : Object.values(val)) : []; }
        render();
      });
    });
  });
}

/* Save a single field to Firebase */
function saveToFirebase(viewKey, field){
  if(!_fbReady) return;
  const d = S[viewKey];
  const val = field === 'reminder' ? d.reminder : d[field];
  _fbDB.ref(fbPath(viewKey, field)).set(val).catch(e => console.warn('Firebase write error:', e));
}

/* Auto-save on every render — only changed view's data */
var _saveDebounce = {};
function autoSave(viewKey){
  if(!_fbReady) return;
  // Debounce 600ms to avoid writes on every keystroke
  clearTimeout(_saveDebounce[viewKey]);
  _saveDebounce[viewKey] = setTimeout(() => {
    ['cases','tips','customQs','kudos','reminder'].forEach(f => saveToFirebase(viewKey, f));
  }, 600);
}
const viewColors={dms:'#EE4D2D',l2rr:'#2563EB',p1:'#7C3AED'};
const viewNames={dms:'DMS',l2rr:'L2RR',p1:'P1'};

/* localStorage for individual quiz scores */
function saveScores(){try{['dms','l2rr','p1'].forEach(v=>{localStorage.setItem('wj_scores_'+v,JSON.stringify(S[v].scores));});}catch(e){}}
function loadScores(){try{['dms','l2rr','p1'].forEach(v=>{const d=localStorage.getItem('wj_scores_'+v);if(d)S[v].scores=JSON.parse(d);});}catch(e){}}

/* Drag-drop file helper — returns base64 data URL */
function dropZone(id,currentUrl,label){
  return `<div class="drop-zone" id="dz-${id}" onclick="$('fi-${id}').click()"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="event.preventDefault();this.classList.remove('drag-over');handleFileDrop('${id}',event.dataTransfer.files[0])">
    ${currentUrl?`<div>✅ File attached</div>${currentUrl.match(/^data:image/)?'<img src="'+currentUrl+'">':currentUrl.match(/^data:video/)?'<video src="'+currentUrl+'" style="max-height:80px"></video>':'<div style="font-size:11px;color:#059669;word-break:break-all">'+currentUrl.slice(0,60)+'...</div>'}`
    :`<div>📎 ${label||'Drag & drop or click to upload'}</div><div style="font-size:11px;margin-top:4px">Supports images & videos</div>`}
    <input type="file" id="fi-${id}" accept="image/*,video/*" style="display:none" onchange="handleFileDrop('${id}',this.files[0])">
  </div>`;
}
var _fileCallbacks={};
function handleFileDrop(id,file){if(!file)return;const r=new FileReader();r.onload=function(e){if(_fileCallbacks[id])_fileCallbacks[id](e.target.result);};r.readAsDataURL(file);}

/* ═══ NAV ═══ */
function renderNav(){
  const vc=viewColors[S.view];
  $('nav-view').innerHTML=`<div class="view-toggle">
    ${['dms','l2rr','p1'].map(v=>`<button class="view-btn ${S.view===v?'on':''}" style="${S.view===v?'background:'+viewColors[v]:''}" onclick="switchView('${v}')">${viewNames[v]}</button>`).join('')}
  </div>`;
  const d=V();
  const tabs=[
    {k:'dashboard',l:'Dashboard',ic:'📊',c:d.cases.length},
    {k:'cases',l:'WJ Cases',ic:'📋',c:d.cases.length},
    {k:'tips',l:'QA Tips',ic:'💡',c:d.tips.length},
    {k:'quiz',l:'Quiz',ic:'🧠'},
    {k:'scores',l:'Quiz Scores',ic:'📝',c:d.scores.length},
  ];

function startQuiz(wf){
  if(!_currentUsername){ showUsernameModal(wf); return; }

function _doStartQuiz(wf){const d=V();let qs=[];
  const fc=wf?d.customQs.filter(q=>q.week===wf):d.customQs;const fca=wf?d.cases.filter(c=>c.week===wf):d.cases;
  fc.forEach(cq=>{if(cq.q&&cq.opts.filter(Boolean).length>=2)qs.push({q:cq.q,opts:cq.opts.filter(Boolean),ans:cq.opts[cq.ans]||cq.opts[0],week:cq.week});});
  if(qs.length<4&&fca.length>=2){fca.slice(0,8-qs.length).forEach((c,i)=>{const ot=d.cases.filter((_,j)=>j!==i);const wr=ot.slice(0,2).map(o=>o.keyLesson||o.painPoint);
    qs.push({q:'Finding: "'+c.findings.slice(0,120)+'…" — Key lesson?',opts:shuffle([c.keyLesson||c.painPoint,...wr,"Escalate to supervisor"]),ans:c.keyLesson||c.painPoint,week:c.week});});}
  if(!qs.length){toast('No questions for this week','error');return;}
  qs=qs.map(q=>({...q,opts:shuffle(q.opts)}));d.qList=qs;d.quiz={on:true,i:0,ans:[],score:0,done:false,wf:wf||''};render();}
function answerQuiz(oi){const d=V();const q=d.quiz;if(q.ans.length>q.i)return;const o=d.qList[q.i].opts[oi];const ok=o===d.qList[q.i].ans;
  q.ans.push({sel:o,ok,week:d.qList[q.i].week});q.score+=(ok?1:0);const last=q.i>=d.qList.length-1;
  if(last){q.done=true;if(q.wf)d.completedWeeks[q.wf]=true;d.scores.unshift({date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}),score:q.score,total:d.qList.length,pct:Math.round(q.score/d.qList.length*100),username:_currentUsername||'Unknown',details:d.qList.map((qq,idx)=>{const a=q.ans[idx]||{};return{q:qq.q,correct:qq.ans,selected:a.sel,ok:a.ok,week:qq.week};})});saveScores();}else{q.i++;}render();}

function undoQ(){const d=V();if(!d.undoQs.length)return;const l=d.undoQs.pop();d.customQs.splice(l.idx,0,l.data);toast('Restored');render();}

function rAdmKudos(){const d=V();
  return `<div class="flex-c mb16"><button class="btn-primary" onclick="V().showAddKudos=!V().showAddKudos;render()">${d.showAddKudos?'✕ Cancel':'+ Add Kudos'}</button>
  <button class="btn-sm btn-undo" onclick="undoKudos()" ${d.undoKudos.length?'':'disabled style="opacity:.4"'}>↩️ Undo</button></div>
  ${d.showAddKudos?rAddKudosForm():''}${d.editingKudos?rEditKudosForm():''}
  ${d.kudos.map((k,i)=>`<div class="card" style="padding:16px 20px;display:flex;align-items:center;gap:14px">
    <div style="width:36px;height:36px;border-radius:10px;background:${i<3?'linear-gradient(135deg,#FFD700,#FFA000)':'#F3F4F6'};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:${i<3?'#fff':'#6B7280'};flex-shrink:0">#${i+1}</div>
    <div style="flex:1"><div style="font-size:14px;font-weight:700">${esc(k.name)} — <span style="color:#EE4D2D">${esc(k.score)}</span></div><div style="font-size:12px;color:#6B7280;margin-top:2px">${esc(k.achievement)}</div></div>
    <button class="btn-sm btn-edit" onclick="editKudos(${i})">✏️ Edit</button><button class="btn-sm btn-del" onclick="delKudos(${i})">🗑 Delete</button></div>`).join('')}
  ${!d.kudos.length?'<div class="text-center" style="padding:30px;color:#6B7280">No kudos yet.</div>':''}`;
}
function rAddKudosForm(){return `<div class="card mb16" style="border-color:#FFD700;padding:20px"><div class="flex-sb mb8"><div style="font-size:13px;font-weight:800;color:#D97706">🏆 New Kudos</div><button style="border:none;background:none;color:#6B7280;font-size:18px;cursor:pointer" onclick="V().showAddKudos=false;render()">✕</button></div>
<input class="inp mb8" id="kd-n" placeholder="Agent Name"><input class="inp mb8" id="kd-s" placeholder="QA Score (e.g. 98%)"><input class="inp mb8" id="kd-a" placeholder="Achievement">
<div class="flex-c"><select class="inp" style="width:auto" id="kd-team"><option value="Vads">Vads</option><option value="ePerformax">ePerformax</option></select><select class="inp" style="width:auto" id="kd-w"><option value="">Week</option>${uv(V().cases,'week').map(w=>`<option>${esc(w)}</option>`).join('')}</select><button class="btn-primary" onclick="addKudos()">Save</button></div></div>`;}
function rEditKudosForm(){const k=V().editingKudos;return `<div class="card mb16" style="border-color:#2563EB;padding:20px"><div style="font-size:13px;font-weight:800;color:#2563EB;margin-bottom:10px">✏️ Edit Kudos</div><input class="inp mb8" value="${esc(k.name)}" oninput="V().editingKudos.name=this.value"><input class="inp mb8" value="${esc(k.score)}" oninput="V().editingKudos.score=this.value"><input class="inp mb8" value="${esc(k.achievement)}" oninput="V().editingKudos.achievement=this.value">
<div class="flex-c"><select class="inp" style="width:auto" id="ek-team"><option value="Vads" ${k.team==='Vads'?'selected':''}>Vads</option><option value="ePerformax" ${k.team==='ePerformax'?'selected':''}>ePerformax</option></select>
<button class="btn-primary" onclick="saveEditKudos()">💾 Save</button><button class="btn-outline" onclick="V().editingKudos=null;render()">Cancel</button></div></div>`;}
function addKudos(){const d=V();const n=$('kd-n').value,s=$('kd-s').value,a=$('kd-a').value,w=$('kd-w').value,team=$('kd-team').value;if(!n||!s)return;d.kudos.push({id:Date.now(),name:n,score:s,achievement:a,week:w,team:team});d.showAddKudos=false;toast('Added!');render();}
function editKudos(i){V().editingKudos={...V().kudos[i],_idx:i};render();}
function saveEditKudos(){const d=V();if(!d.editingKudos)return;const i=d.editingKudos._idx;const ek=d.editingKudos;const teamEl=$('ek-team');d.kudos[i]={id:d.kudos[i].id,name:ek.name,score:ek.score,achievement:ek.achievement,week:d.kudos[i].week,team:teamEl?teamEl.value:d.kudos[i].team};d.editingKudos=null;toast('Updated');render();}
function delKudos(i){const d=V();d.undoKudos.push({data:d.kudos[i],idx:i});d.kudos.splice(i,1);toast('Deleted');render();}
function undoKudos(){const d=V();if(!d.undoKudos.length)return;const l=d.undoKudos.pop();d.kudos.splice(l.idx,0,l.data);toast('Restored');render();}

function rAdmReminder(){const d=V();
  return `<div class="card" style="padding:24px"><h3 style="font-size:17px;font-weight:800;margin-bottom:16px">📢 Weekly Reminder Banner</h3>
  <p style="font-size:13px;color:#6B7280;margin-bottom:12px">This text appears on the dashboard banner. Edit it to update the weekly reminder for agents.</p>
  <textarea class="inp" id="adm-reminder" rows="4" style="margin-bottom:12px">${esc(d.reminder)}</textarea>
  <button class="btn-primary" onclick="saveReminder()">💾 Save Reminder</button></div>`;
}
function saveReminder(){V().reminder=$('adm-reminder').value;toast('Reminder updated!');render();}

/* ═══ IMPORT/EXPORT ═══ */
function rAdmIO(){return `<div class="g3 mb16">${[{t:'cases',ic:'📋',l:'WJ Cases'},{t:'tips',ic:'💡',l:'QA Tips'},{t:'quiz',ic:'🧠',l:'Quiz Questions'}].map(({t,ic,l})=>`<div class="card text-center" style="padding:24px"><div style="font-size:32px;margin-bottom:10px">${ic}</div><h3 style="font-size:15px;font-weight:800;margin-bottom:4px">${l}</h3><p style="font-size:12px;color:#6B7280;margin-bottom:14px">Import or export</p>
<button class="btn-primary" style="width:100%;margin-bottom:8px" onclick="V()._importTarget='${t}';$('file-import').click()">⬆ Import .xlsx</button><button class="btn-outline" style="width:100%" onclick="exportData('${t}')">⬇ Export .xlsx</button></div>`).join('')}</div>
<div class="card" style="padding:22px"><h4 style="font-size:14px;font-weight:800;margin-bottom:12px">📄 Column Guides</h4>${[{l:'Cases',c:'id, week, returnReason, agent, rcaL1, rcaL2, rcaL3, findings, coaching, painPoint, keyLesson'},{l:'Tips',c:'title, tip, category, week, date'},{l:'Quiz',c:'question, option1, option2, option3, option4, correctAnswer, week'}].map(g=>`<div class="mb12"><div style="font-size:13px;font-weight:700;color:#EE4D2D;margin-bottom:4px">${g.l}</div><div style="background:#F3F4F6;border-radius:8px;padding:10px 14px;font-size:12px;font-family:monospace;line-height:1.6">${g.c}</div></div>`).join('')}</div>`;}

$('file-import').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;const d=V();const target=d._importTarget;
  const r=new FileReader();r.onload=function(ev){try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);
    if(target==='cases'){d.cases=d.cases.concat(data);toast('Imported '+data.length+' case(s)');}
    else if(target==='tips'){d.tips=d.tips.concat(data.map(function(x){x.id=Date.now()+Math.random();return x;}));toast('Imported '+data.length+' tip(s)');}
    else if(target==='quiz'){data.forEach(function(x){d.customQs.push({q:x.question||x.q||'',opts:[x.option1||'',x.option2||'',x.option3||'',x.option4||''].filter(Boolean),ans:0,week:x.week||''});});toast('Imported '+data.length+' quiz q(s)');}
    render();
  }catch(err){toast('Import failed','error');}};r.readAsArrayBuffer(f);e.target.value='';
});
function exportData(target){const d=V();var data,fn;
  if(target==='cases'){data=d.cases;fn=viewNames[S.view]+'_Cases.xlsx';}
  else if(target==='tips'){data=d.tips;fn=viewNames[S.view]+'_Tips.xlsx';}
  else{data=d.customQs.map(function(q){return{question:q.q,option1:q.opts[0]||'',option2:q.opts[1]||'',option3:q.opts[2]||'',option4:q.opts[3]||'',correctAnswer:q.opts[q.ans]||'',week:q.week};});fn=viewNames[S.view]+'_Quiz.xlsx';}
  var ws=XLSX.utils.json_to_sheet(data);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');XLSX.writeFile(wb,fn);toast('Exported '+fn);}

loadScores();
loadUsername();
_fileCallbacks['nc-img']=function(d){V()._ncImgData=d;};
_fileCallbacks['nc-vid']=function(d){V()._ncVidData=d;};
_fileCallbacks['nt-img']=function(d){V()._ntImgData=d;};
_fileCallbacks['nt-vid']=function(d){V()._ntVidData=d;};
/* Init Firebase — loads all shared data, then renders */
initFirebase();
</script>
</body>
</html>
