<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJ Dashboard v9</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit','Segoe UI',sans-serif;min-height:100vh;background:#F5F6F8;color:#1A1A1A;display:flex}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeUp{animation:fadeUp .35s ease both}
#sidebar{width:230px;background:#fff;border-right:1px solid #E5E7EB;padding:16px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo-row{display:flex;align-items:center;gap:10px;padding:10px 10px 20px;border-bottom:1px solid #E5E7EB;margin-bottom:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1.5px solid #E5E7EB}
.logo-title{font-size:15px;font-weight:900;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:#6B7280;font-weight:600;letter-spacing:.3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:all .2s;background:transparent;color:#6B7280}
.nav-btn.active{background:linear-gradient(135deg,#EE4D2D,#FF6B47);color:#fff;box-shadow:0 4px 15px rgba(238,77,45,.25)}
.nav-btn .icon{font-size:17px}.nav-btn .label{flex:1}
.nav-btn .count{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;background:rgba(238,77,45,.1);color:#EE4D2D}
.nav-btn.active .count{background:rgba(255,255,255,.25);color:#fff}
#main{flex:1;padding:28px 36px;overflow-y:auto;max-height:100vh}
.card{background:#fff;border-radius:16px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:24px;margin-bottom:16px}
.card-hover{transition:all .2s}.card-hover:hover{border-color:#EE4D2D;box-shadow:0 6px 24px rgba(238,77,45,.1);transform:translateY(-1px)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.btn-primary{padding:10px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,#EE4D2D,#FF6B47);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(238,77,45,.25)}
.btn-outline{padding:10px 22px;border-radius:10px;border:1.5px solid #EE4D2D;background:#fff;color:#EE4D2D;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn-edit{border:1px solid #2563EB;background:#EFF6FF;color:#2563EB}
.btn-del{border:1px solid #DC2626;background:#FEF2F2;color:#DC2626}
.btn-undo{border:1px solid #2563EB;background:#EFF6FF;color:#2563EB}
.week-hdr{padding:10px 0;margin:16px 0 10px;border-bottom:2px solid #EE4D2D;display:flex;align-items:center;gap:10px}
.week-tag{background:#EE4D2D;color:#fff;padding:4px 14px;border-radius:8px;font-size:12px;font-weight:800}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #E5E7EB;font-size:13px;font-family:inherit;outline:none;transition:border .2s}
.inp:focus{border-color:#EE4D2D;box-shadow:0 0 0 3px rgba(238,77,45,.1)}
select.inp{cursor:pointer;background:#fff}
.filter-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filter-label{font-size:12px;font-weight:700;color:#6B7280}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{padding:20px 22px}
.stat-label{font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat-val{font-size:30px;font-weight:900}
.rca-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rca-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.rca-bar{height:8px;border-radius:4px;background:#F3F4F6;overflow:hidden;margin-top:5px}
.rca-fill{height:100%;border-radius:4px}
.rca-count{font-size:22px;font-weight:900}
.quiz-opt{padding:14px 20px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;color:#1A1A1A;font-size:14px;font-weight:500;text-align:left;cursor:pointer;line-height:1.6;font-family:inherit;transition:all .15s;width:100%;margin-bottom:10px;display:block}
.quiz-opt:hover{border-color:#EE4D2D;background:#FFF5F2}
.quiz-opt.correct{border-color:#059669;background:#ECFDF5}.quiz-opt.wrong{border-color:#DC2626;background:#FEF2F2}
.quiz-opt.disabled{cursor:default}.quiz-opt.disabled:hover{border-color:#E5E7EB;background:#fff}
.notif{border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
#toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 24px;border-radius:12px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;animation:fadeUp .3s ease}
.score-detail{background:#fff;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 16px 16px;padding:16px 22px;margin-bottom:12px}
.tip-expanded{margin-top:12px;padding:14px 18px;background:#F3F4F6;border-radius:12px;font-size:14px;line-height:1.8}
.admin-q-opt{padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:6px;border:1px solid #E5E7EB}
.admin-q-opt.correct{border-color:#059669;background:#ECFDF5;font-weight:700;color:#059669}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flex-sb{display:flex;justify-content:space-between;align-items:center}
.flex-c{display:flex;align-items:center;gap:8px}
.flex-w{display:flex;flex-wrap:wrap;gap:6px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.text-center{text-align:center}.pointer{cursor:pointer}
.view-toggle{display:flex;gap:0;margin-bottom:12px;background:#F3F4F6;border-radius:12px;padding:4px}
.view-btn{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:transparent;color:#6B7280;text-align:center}
.view-btn.on{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.drop-zone{border:2px dashed #E5E7EB;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px;font-size:12px;color:#6B7280}
.drop-zone:hover,.drop-zone.drag-over{border-color:#EE4D2D;background:#FFF5F2;color:#EE4D2D}
.drop-zone img,.drop-zone video{max-width:100%;max-height:120px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo-row">
    <div class="logo-icon"><svg width="36" height="36" viewBox="0 0 120 120" fill="none"><rect width="120" height="120" fill="#fff"/><path d="M60 16c-8 0-15 4.5-18.5 11.2h37C75 20.5 68 16 60 16z" fill="#EE4D2D"/><path d="M41 26h-1.5c-.5 0-1 .1-1.4.3A27.5 27.5 0 0032 28v.5l3 56c.3 5 4.5 9 9.5 9h31c5 0 9.2-4 9.5-9l3-56V28a27 27 0 00-6-1.7c-.5-.2-1-.3-1.5-.3H79" fill="#EE4D2D"/><path d="M41.5 27.2a3.2 3.2 0 01-.3-1.3 3 3 0 013-3h.3A19 19 0 0160 13a19 19 0 0115.5 9.9h.3a3 3 0 013 3c0 .5-.1.9-.3 1.3" stroke="#EE4D2D" stroke-width="5" fill="none"/><text x="60" y="72" text-anchor="middle" fill="#fff" font-weight="900" font-size="38" font-family="Arial">S</text></svg></div>
    <div><div class="logo-title">WJ Dashboard</div><div class="logo-sub">Return and Refund</div><div id="sidebar-username" style="font-size:11px;font-weight:700;margin-top:5px;cursor:pointer" onclick="_currentUsername?showEditProfileModal():showUsernameModal('')" title="Click to sign in or edit profile"><span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:8px;background:#FEF2F2;color:#EE4D2D;border:1.5px dashed #EE4D2D;font-size:11px">👤 Sign In</span></div></div>
  </div>
  <div id="nav-view"></div>
  <div id="nav"></div>
  <div style="flex:1"></div>
  <div id="nav-admin"></div>
  <div id="fb-status" style="margin-top:8px;padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;background:#FEF3C7;color:#D97706;display:flex;align-items:center;gap:6px">
    <span style="width:7px;height:7px;border-radius:50%;background:#D97706;flex-shrink:0;display:inline-block"></span>
    <span id="fb-status-text">Connecting…</span>
  </div>
  <div id="fb-refresh-time" style="font-size:10px;color:#9CA3AF;margin-top:4px;padding:0 4px;display:none">Last synced: —</div>
  <div id="sheet-sync-badge" style="font-size:10px;color:#059669;font-weight:700;margin-top:4px;padding:0 4px;display:none"></div>
</div>
<div id="main"></div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".xlsx,.xls" style="display:none">
<!-- Paste JSON Modal -->
<div id="edit-profile-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:32px 28px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center">
    <div style="font-size:36px;margin-bottom:8px">👤</div>
    <h2 style="font-size:18px;font-weight:900;margin-bottom:16px">Edit Profile</h2>
    <input id="edit-name-input" class="inp" placeholder="Your full name..." style="margin-bottom:12px;font-size:15px;text-align:center">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button id="edit-bpo-vads" onclick="editSelectBPO('Vads')" style="flex:1;padding:10px;border-radius:10px;border:2px solid #E5E7EB;background:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#6B7280">Vads</button>
      <button id="edit-bpo-ep" onclick="editSelectBPO('ePerformax')" style="flex:1;padding:10px;border-radius:10px;border:2px solid #E5E7EB;background:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#6B7280">ePerformax</button>
      <button id="edit-bpo-ar" onclick="editSelectBPO('Asia Recruit')" style="flex:1;padding:10px;border-radius:10px;border:2px solid #E5E7EB;background:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#6B7280">Asia Recruit</button>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-primary" style="flex:1" onclick="saveEditProfile()">Save</button>
      <button onclick="document.getElementById('edit-profile-modal').style.display='none'" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Cancel</button>
    </div>
  </div>
</div>
<div id="username-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#EE4D2D,#FF6B47);display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg width="32" height="32" viewBox="0 0 120 120" fill="none"><path d="M60 16c-8 0-15 4.5-18.5 11.2h37C75 20.5 68 16 60 16z" fill="#fff"/><path d="M41 26h-1.5c-.5 0-1 .1-1.4.3A27.5 27.5 0 0032 28v.5l3 56c.3 5 4.5 9 9.5 9h31c5 0 9.2-4 9.5-9l3-56V28a27 27 0 00-6-1.7c-.5-.2-1-.3-1.5-.3H79" fill="#fff"/><text x="60" y="72" text-anchor="middle" fill="#EE4D2D" font-weight="900" font-size="38" font-family="Arial">S</text></svg></div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px">Welcome to WJ Dashboard</h2>
    <p style="font-size:14px;color:#6B7280;margin-bottom:24px">Enter your name and select your BPO to get started.</p>
    <input id="username-input" class="inp" placeholder="Your full name..." style="margin-bottom:14px;font-size:15px;text-align:center" onkeydown="if(event.key==='Enter')confirmUsername()">
    <p style="font-size:12px;font-weight:700;color:#6B7280;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Select your BPO</p>
    <div style="display:flex;gap:10px;margin-bottom:24px">
      <button id="bpo-vads" onclick="selectBPO('Vads')" style="flex:1;padding:14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;color:#6B7280">Vads</button>
      <button id="bpo-ep" onclick="selectBPO('ePerformax')" style="flex:1;padding:14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;color:#6B7280">ePerformax</button>
      <button id="bpo-ar" onclick="selectBPO('Asia Recruit')" style="flex:1;padding:14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;color:#6B7280">Asia Recruit</button>
    </div>
    <button class="btn-primary" style="width:100%;padding:14px;font-size:15px" onclick="confirmUsername()">Let's Go! →</button>
  </div>
</div>
<script>
/* ═══ MULTI-VIEW STATE ═══ */
function mkView(sampleCases,sampleTips,sampleQs,sampleKudos){
  return {cases:sampleCases||[],tips:sampleTips||[],customQs:sampleQs||[],scores:[],kudos:sampleKudos||[],
    sel:null,quiz:{on:false,i:0,ans:[],score:0,done:false},qList:[],
    fWeek:'All',fTopic:'All',fKeyword:'',tipCat:'All',tipWeekF:'All',tipKeyword:'',
    expandedTip:null,expandedScore:null,completedWeeks:{},
    adminSub:'cases',adminCaseWeek:'All',adminTipWeek:'All',adminQWeek:'All',
    showAddCase:false,showAddTip:false,showAddQ:false,showAddKudos:false,
    editQIdx:null,editingCase:null,editingTip:null,editingKudos:null,
    undoCases:[],undoTips:[],undoQs:[],undoKudos:[],
    _prefillCaseWeek:'',_prefillTipWeek:'',_qFormAns:0,_importTarget:'',
    _ncImgData:'',_ncVidData:'',_ntImgData:'',_ntVidData:'',
    reminder:['','','','',''],
    _reminderUndo:null,
    acks:[],  // [{type:'case'|'tip', id, username, bpo, date}]
    mdCases:[],  // L2RR-only: separate Markdown cases dataset
    mdFWeek:'All',mdFTopic:'All',mdFKeyword:'',
    mdSel:null,
  };
}

const S = {
  view: 'dms',
  tab: 'dashboard',
  dms: mkView([],[],[],[]),
  l2rr: mkView([],[],[],[]),
  p1: mkView([],[],[],[]),
  _visits: [],  // traffic log — array of {ts, day, hour, dow}
};

/* ═══ HELPERS ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function V(){return S[S.view];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function groupByWeek(arr){const m={};arr.forEach(c=>{const w=c.week||'Unassigned';if(!m[w])m[w]=[];m[w].push(c);});return Object.entries(m);}
function uv(arr,key){return[...new Set(arr.map(a=>a[key]).filter(Boolean))];}
function countBy(arr,key){const m={};arr.forEach(a=>{const v=a[key];m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function toast(msg,type){const t=$('toast');t.textContent=msg;t.style.background=type==='error'?'#DC2626':'#059669';t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
function badge(text,color,bg){return `<span class="badge" style="color:${color};background:${bg}">${esc(text)}</span>`;}
function dd(id,value,options,ph,onchange){return `<select class="inp" style="width:auto;min-width:130px" id="${id}" onchange="${onchange}"><option value="All">${ph||'All'}</option>${options.filter(o=>o!=='All').map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function weekBtn(w,fn){return `<div style="margin-left:auto"><button style="padding:4px 12px;border-radius:6px;border:1px solid #EE4D2D;background:#FFF5F2;color:#EE4D2D;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="${fn}">+ Add to ${esc(w)}</button></div>`;}

const VER='v9';

/* ═══ USERNAME + BPO ═══ */
var _currentUsername = '';
var _currentBPO = '';

function loadUsername(){
  try{
    _currentUsername = localStorage.getItem('wj_username')||'';
    _currentBPO = localStorage.getItem('wj_bpo')||'';
  }catch(e){}
  updateSidebarUsername();
}

function updateSidebarUsername(){
  const el = document.getElementById('sidebar-username');
  if(!el) return;
  if(_currentUsername){
    const bpoColor = _currentBPO==='Vads'?'#EE4D2D':_currentBPO==='ePerformax'?'#2563EB':_currentBPO==='Asia Recruit'?'#059669':'#6B7280';
    const bpoBg = _currentBPO==='Vads'?'#FFF5F2':_currentBPO==='ePerformax'?'#EFF6FF':_currentBPO==='Asia Recruit'?'#ECFDF5':'#F3F4F6';
    el.onclick=function(){showEditProfileModal();};
    el.title='Click to edit profile';
    el.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:8px;background:'+bpoBg+';color:'+bpoColor+';border:1.5px solid '+bpoColor+';font-size:11px">👤 '+esc(_currentUsername)+(_currentBPO?' <span style="background:'+bpoColor+';color:#fff;padding:1px 7px;border-radius:6px;font-size:10px;margin-left:2px">'+esc(_currentBPO)+'</span>':'')+'</span>';
  } else {
    el.onclick=function(){showUsernameModal('');};
    el.title='Click to sign in';
    el.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:8px;background:#FEF2F2;color:#EE4D2D;border:1.5px dashed #EE4D2D;font-size:11px">👤 Sign In</span>';
  }
}

function selectBPO(bpo){
  _currentBPO = bpo;
  ['Vads','ePerformax','Asia Recruit'].forEach(b=>{
    const id = b==='Vads'?'bpo-vads':b==='ePerformax'?'bpo-ep':'bpo-ar';
    const el=document.getElementById(id);
    if(!el)return;
    const active=bpo===b;
    const col=b==='Vads'?'#EE4D2D':b==='ePerformax'?'#2563EB':'#059669';
    const bg=b==='Vads'?'#FFF5F2':b==='ePerformax'?'#EFF6FF':'#ECFDF5';
    el.style.borderColor=active?col:'#E5E7EB';
    el.style.background=active?bg:'#fff';
    el.style.color=active?col:'#6B7280';
  });
}

var _editBPOTemp = '';
function showEditProfileModal(){
  const modal = document.getElementById('edit-profile-modal');
  if(!modal) return;
  modal.style.display='flex';
  const inp = document.getElementById('edit-name-input');
  if(inp) inp.value = _currentUsername||'';
  _editBPOTemp = _currentBPO||'';
  if(_editBPOTemp) editSelectBPO(_editBPOTemp);
}
function editSelectBPO(bpo){
  _editBPOTemp = bpo;
  ['Vads','ePerformax','Asia Recruit'].forEach(b=>{
    const id='edit-bpo-'+(b==='Vads'?'vads':b==='ePerformax'?'ep':'ar');
    const el=document.getElementById(id); if(!el) return;
    const active=bpo===b;
    const col=b==='Vads'?'#EE4D2D':b==='ePerformax'?'#2563EB':'#059669';
    const bg=b==='Vads'?'#FFF5F2':b==='ePerformax'?'#EFF6FF':'#ECFDF5';
    el.style.borderColor=active?col:'#E5E7EB';
    el.style.background=active?bg:'#fff';
    el.style.color=active?col:'#6B7280';
  });
}
function saveEditProfile(){
  const inp=document.getElementById('edit-name-input');
  const name=(inp?inp.value:'').trim();
  if(!name){ inp&&inp.focus(); toast('Please enter your name','error'); return; }
  if(!_editBPOTemp){ toast('Please select your BPO','error'); return; }
  _currentUsername=name; _currentBPO=_editBPOTemp;
  try{ localStorage.setItem('wj_username',name); localStorage.setItem('wj_bpo',_editBPOTemp); }catch(e){}
  updateSidebarUsername();
  document.getElementById('edit-profile-modal').style.display='none';
  toast('✅ Profile updated!');
}

function showUsernameModal(pendingWeek){
  const modal = document.getElementById('username-modal');
  if(modal){ modal.style.display='flex'; modal._pendingWeek=pendingWeek||''; }
  setTimeout(()=>{
    const inp=document.getElementById('username-input');
    if(inp){ inp.value=_currentUsername||''; inp.focus(); }
    if(_currentBPO) selectBPO(_currentBPO);
  },50);
}

function confirmUsername(){
  const inp = document.getElementById('username-input');
  const name = (inp?inp.value:'').trim();
  if(!name){ inp&&inp.focus(); toast('Please enter your name','error'); return; }
  if(!_currentBPO){ toast('Please select your BPO','error'); return; }
  _currentUsername = name;
  try{
    localStorage.setItem('wj_username', name);
    localStorage.setItem('wj_bpo', _currentBPO);
  }catch(e){}
  updateSidebarUsername();
  updateVisitUser(name, _currentBPO); // tag the existing visit record with username + BPO
  const modal = document.getElementById('username-modal');
  const pendingWeek = modal?modal._pendingWeek:null;
  if(modal) modal.style.display='none';
  toast('👋 Welcome, '+esc(name)+'!');
  if(pendingWeek) _doStartQuiz(pendingWeek);
  else render();
}

function updateSheetSyncBadge(isoString){
  const el = document.getElementById('sheet-sync-badge');
  if(!el) return;
  try{
    const d = new Date(isoString);
    const label = d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    el.textContent = '📊 Sheet synced: '+label;
    el.style.display = 'block';
  }catch(e){}
}

function fbStatus(state){
  const el=document.getElementById('fb-status');
  const txt=document.getElementById('fb-status-text');
  const timeEl=document.getElementById('fb-refresh-time');
  if(!el||!txt)return;
  const map={ok:['#ECFDF5','#059669','🟢 Synced'],err:['#FEF2F2','#DC2626','🔴 Not connected'],warn:['#FEF3C7','#D97706','🟡 Connecting…'],local:['#F3F4F6','#6B7280','⚫ Local only']};
  const [bg,col,label]=map[state]||map.warn;
  el.style.background=bg;el.style.color=col;txt.textContent=label;
  el.querySelector('span').style.background=col;
  if(timeEl){
    if(state==='ok'){
      const now=new Date();
      const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const d=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      timeEl.textContent='Last synced: '+d+', '+t;
      timeEl.style.display='block';
    } else if(state==='local'){
      timeEl.style.display='none';
    }
  }
}

function initFirebase(){
  if(!fbConfigured()){
    console.warn('Firebase not configured — running in local-only mode.');
    fbStatus('local');
    render();
    return;
  }
  // Dynamically load Firebase SDK (compat v9)
  const sdks = [
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
  ];
  let loaded = 0;
  sdks.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => { loaded++; if(loaded === sdks.length) onFirebaseLoaded(); };
    s.onerror = () => { console.error('Failed to load Firebase SDK'); render(); };
    document.head.appendChild(s);
  });
}

function onFirebaseLoaded(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _fbDB = firebase.database();
    _fbReady = true;
    fbStatus('warn');
    loadAllFromFirebase();
    logVisit();
    subscribeVisits();
  }catch(e){
    console.error('Firebase init error:', e);
    fbStatus('err');
    render();
  }
}

function fbPath(view, field){
  return 'wjdashboard/' + view + '/' + field;
}

/* Load all views from Firebase, then subscribe to live updates */
function loadAllFromFirebase(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder','scores','acks','mdCases'];
  let pending = views.length * fields.length + 1; // +1 for _lastSheetSync

  function done(){ pending--; if(pending===0){ loadAcks(); render(); fbStatus('ok'); subscribeAll(); } }

  // Read last sheet push timestamp set by Apps Script trigger
  _fbDB.ref('_lastSheetSync').once('value', snap => {
    if(snap.val()) updateSheetSyncBadge(snap.val());
    _fbDB.ref('_lastSheetSync').on('value', s => { if(s.val()) updateSheetSyncBadge(s.val()); });
    done();
  }, () => done());

  views.forEach(v => {
    fields.forEach(f => {
      _fbDB.ref(fbPath(v,f)).once('value', snap => {
        const val = snap.val();
        if(val !== null){
          if(f==='reminder'){ const a=Array.isArray(val)?val:(val?[val]:[]);while(a.length<5)a.push('');S[v].reminder=a; }
          else{ S[v][f]=Array.isArray(val)?val:Object.values(val||{}); }
        }
        done();
      }, () => done());
    });
  });
}

/* Live listeners — update state & re-render when another user changes data */
function subscribeAll(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder','scores','acks','mdCases'];
  views.forEach(v => {
    fields.forEach(f => {
      const key = v+':'+f;
      if(_fbListeners[key]) return; // already subscribed
      const ref = _fbDB.ref(fbPath(v, f));
      _fbListeners[key] = ref.on('value', snap => {
        const val = snap.val();
        if(f === 'reminder'){ const v5=Array.isArray(val)?val:(val?[val]:[]);while(v5.length<5)v5.push('');S[v].reminder=v5; }
        else { S[v][f] = val ? (Array.isArray(val) ? val : Object.values(val)) : []; }
        if(f === 'acks') loadAcks();
        render();
      });
    });
  });
}

/* Save a single field to Firebase */
function saveToFirebase(viewKey, field){
  if(!_fbReady) return;
  const d = S[viewKey];
  const val = field === 'reminder' ? d.reminder : d[field];
  _fbDB.ref(fbPath(viewKey, field)).set(val).catch(e => console.warn('Firebase write error:', e));
}

/* ── TRAFFIC / VISIT TRACKING ────────────────────────────────────
   Logs one visit per browser session to wjdashboard/_visits
   Uses sessionStorage to avoid double-counting tab switches.     */
function logVisit(){
  if(!_fbReady) return;
  if(sessionStorage.getItem('_wjVisitLogged')) return;
  const now = new Date();
  const record = {
    ts:       now.toISOString(),
    day:      now.toISOString().slice(0,10),
    hour:     now.getHours(),
    dow:      now.getDay(),
    username: _currentUsername || null,
    bpo:      _currentBPO      || null,
  };
  _fbDB.ref('wjdashboard/_visits').push(record)
    .then(ref=>{
      sessionStorage.setItem('_wjVisitLogged', '1');
      sessionStorage.setItem('_wjVisitKey', ref.key); // store key so we can patch username later
    })
    .catch(e=>console.warn('Visit log error:',e));
}

/* Called from confirmUsername() — patches username+bpo onto the existing visit record */
function updateVisitUser(username, bpo){
  if(!_fbReady) return;
  const key = sessionStorage.getItem('_wjVisitKey');
  if(!key) return;
  _fbDB.ref('wjdashboard/_visits/' + key).update({ username, bpo })
    .catch(e=>console.warn('Visit user update error:',e));
}

function subscribeVisits(){
  if(!_fbReady) return;
  _fbDB.ref('wjdashboard/_visits').on('value', snap=>{
    const val = snap.val();
    S._visits = val ? Object.values(val) : [];
    render();
  }, e => console.warn('Visit subscribe error:',e));
}

/* Auto-save on every render — only changed view's data */
var _saveDebounce = {};
function autoSave(viewKey){
  if(!_fbReady) return;
  // Debounce 600ms to avoid writes on every keystroke
  clearTimeout(_saveDebounce[viewKey]);
  _saveDebounce[viewKey] = setTimeout(() => {
    ['cases','tips','customQs','kudos','reminder','scores','acks','mdCases'].forEach(f => saveToFirebase(viewKey, f));
  }, 600);
}
const viewColors={dms:'#EE4D2D',l2rr:'#2563EB',p1:'#7C3AED'};
const viewNames={dms:'DMS',l2rr:'L2RR',p1:'P1'};

/* Quiz scores — saved to Firebase (shared) with localStorage fallback */
function saveScores(){
  if(_fbReady){
    ['dms','l2rr','p1'].forEach(v => saveToFirebase(v,'scores'));
  } else {
    try{['dms','l2rr','p1'].forEach(v=>{localStorage.setItem('wj_scores_'+v,JSON.stringify(S[v].scores));});}catch(e){}
  }
}
function loadScores(){
  // Only used as fallback when Firebase is not configured
  try{['dms','l2rr','p1'].forEach(v=>{const d=localStorage.getItem('wj_scores_'+v);if(d)S[v].scores=JSON.parse(d);});}catch(e){}
}

/* Acknowledgements — saved to Firebase + always localStorage as backup */
function saveAcks(){
  ['dms','l2rr','p1'].forEach(v => {
    if(_fbReady) saveToFirebase(v,'acks');
    try{ localStorage.setItem('wj_acks_'+v, JSON.stringify(S[v].acks||[])); }catch(e){}
  });
}
function loadAcks(){
  try{['dms','l2rr','p1'].forEach(v=>{
    const raw=localStorage.getItem('wj_acks_'+v);
    if(!raw) return;
    const local=JSON.parse(raw);
    if(!local.length) return;
    const existing=S[v].acks||[];
    local.forEach(a=>{
      if(!existing.find(e=>e.type===a.type&&e.id===a.id&&e.username===a.username)) existing.push(a);
    });
    S[v].acks=existing;
  });}catch(e){}
}

/* Drag-drop file helper — returns base64 data URL */
function dropZone(id,currentUrl,label){
  return `<div class="drop-zone" id="dz-${id}" onclick="$('fi-${id}').click()"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="event.preventDefault();this.classList.remove('drag-over');handleFileDrop('${id}',event.dataTransfer.files[0])">
    ${currentUrl?`<div>✅ File attached</div>${currentUrl.match(/^data:image/)?'<img src="'+currentUrl+'">':currentUrl.match(/^data:video/)?'<video src="'+currentUrl+'" style="max-height:80px"></video>':'<div style="font-size:11px;color:#059669;word-break:break-all">'+currentUrl.slice(0,60)+'...</div>'}`
    :`<div>📎 ${label||'Drag & drop or click to upload'}</div><div style="font-size:11px;margin-top:4px">Supports images & videos</div>`}
    <input type="file" id="fi-${id}" accept="image/*,video/*" style="display:none" onchange="handleFileDrop('${id}',this.files[0])">
  </div>`;
}
var _fileCallbacks={};
function handleFileDrop(id,file){if(!file)return;const r=new FileReader();r.onload=function(e){if(_fileCallbacks[id])_fileCallbacks[id](e.target.result);};r.readAsDataURL(file);}

  else{m.scrollTop=st;}

}

/* Convert Google Drive share URL to direct embeddable URL */
function driveEmbed(url){
  if(!url) return '';
  // Handle /file/d/FILE_ID/view or /open?id=FILE_ID
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=view&id='+m[1];
  return url; // not a Drive URL, return as-is
}
function driveVideo(url){
  if(!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}
function isDriveUrl(url){ return url && url.includes('drive.google.com'); }

function startQuiz(wf){
  if(!_currentUsername){ showUsernameModal(wf); return; }

function _doStartQuiz(wf){const d=V();let qs=[];
  const fc=wf?d.customQs.filter(q=>q.week===wf):d.customQs;const fca=wf?d.cases.filter(c=>c.week===wf):d.cases;
  fc.forEach(cq=>{if(cq.q&&cq.opts.filter(Boolean).length>=2)qs.push({q:cq.q,opts:cq.opts.filter(Boolean),ans:cq.opts[cq.ans]||cq.opts[0],week:cq.week});});
  if(qs.length<4&&fca.length>=2){fca.slice(0,8-qs.length).forEach((c,i)=>{const ot=d.cases.filter((_,j)=>j!==i);const wr=ot.slice(0,2).map(o=>o.keyLesson||o.painPoint);
    qs.push({q:'Finding: "'+c.findings.slice(0,120)+'…" — Key lesson?',opts:shuffle([c.keyLesson||c.painPoint,...wr,"Escalate to supervisor"]),ans:c.keyLesson||c.painPoint,week:c.week});});}
  if(!qs.length){toast('No questions for this week','error');return;}
  qs=qs.map(q=>({...q,opts:shuffle(q.opts)}));d.qList=qs;d.quiz={on:true,i:0,ans:[],score:0,done:false,wf:wf||''};render();}
function answerQuiz(oi){const d=V();const q=d.quiz;if(q.ans.length>q.i)return;const o=d.qList[q.i].opts[oi];const ok=o===d.qList[q.i].ans;

function buildPodium(scores, bpoName, accentColor, accentBg){
  const bestByUser={};
  scores.filter(s=>(s.bpo||'')=== bpoName).forEach(s=>{
    const u=s.username||'Unknown';
    if(!bestByUser[u]||s.pct>bestByUser[u].pct) bestByUser[u]={...s,username:u};
  });
  const top3=Object.values(bestByUser).sort((a,b)=>b.pct-a.pct).slice(0,3);
  const medals=['🥇','🥈','🥉'];
  const podiumColors=['#D97706','#6B7280','#B45309'];
  const podiumBgs=['linear-gradient(135deg,#FDE68A,#FCD34D)','linear-gradient(135deg,#E5E7EB,#D1D5DB)','linear-gradient(135deg,#FCD9A0,#F59E0B)'];
  const heights=[100,130,80];
  const order=[1,0,2];

  const podiumSlots = order.map(p=>{
    const k=top3[p];
    const h=heights[p===1?0:p===0?1:2];
    if(!k) return `<div style="display:flex;flex-direction:column;align-items:center;width:96px">
      <div style="font-size:${p===0?26:20}px;margin-bottom:6px">${medals[p]}</div>
      <div style="font-size:12px;color:#D1D5DB;font-weight:700;margin-bottom:6px">—</div>
      <div style="width:100%;height:${h}px;border-radius:10px 10px 0 0;background:#F3F4F6;display:flex;align-items:center;justify-content:center">
        <span style="font-size:24px;font-weight:900;color:#E5E7EB">${p+1}</span>
      </div></div>`;
    return `<div style="display:flex;flex-direction:column;align-items:center;width:96px">
      <div style="font-size:${p===0?26:20}px;margin-bottom:4px">${medals[p]}</div>
      <div style="font-size:12px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:2px">${esc(k.username)}</div>
      <div style="font-size:18px;font-weight:900;color:${podiumColors[p]};margin-bottom:2px">${k.pct}%</div>
      <div style="font-size:10px;color:#6B7280;margin-bottom:6px">${k.score}/${k.total}</div>
      <div style="width:100%;height:${h}px;border-radius:10px 10px 0 0;background:${podiumBgs[p]};display:flex;align-items:center;justify-content:center">
        <span style="font-size:22px;font-weight:900;color:rgba(0,0,0,.12)">${p+1}</span>
      </div></div>`;
  }).join('');

  const spotsLeft = 3 - top3.length;
  return `<div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <div style="width:10px;height:10px;border-radius:50%;background:${accentColor};flex-shrink:0"></div>
      <span style="font-size:15px;font-weight:900;color:${accentColor}">${esc(bpoName)}</span>
    </div>
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:4px 0">
      ${podiumSlots}
    </div>
    ${spotsLeft>0?`<p style="font-size:11px;color:#9CA3AF;text-align:center;margin-top:8px">${spotsLeft} spot${spotsLeft!==1?'s':''} open</p>`:''}
  </div>`;
}

      <div style="font-size:14px;font-weight:800;margin-bottom:2px">WJ Dashboard Masterfile</div>

    <a href="${MASTERFILE_LINK}" target="_blank" rel="noopener noreferrer"
       style="padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#059669,#10B981);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px">

  /* Collect all scores across all views */
  const allScores = ['dms','l2rr','p1'].flatMap(v => (S[v].scores||[]).map(s=>({...s,view:v.toUpperCase()})));
  if(!allScores.length) return masterfileCard + `<div class="card" style="padding:40px;text-align:center"><div style="font-size:48px;margin-bottom:12px">👥</div><h3 style="font-weight:800;margin-bottom:8px">No quiz data yet</h3><p style="color:#6B7280;font-size:13px">User stats will appear here once agents start taking quizzes.</p></div>`;

  const byUser={};
  allScores.forEach(s=>{
    const u=s.username||'Unknown'; const b=s.bpo||'—';
    if(!byUser[u]) byUser[u]={username:u,bpo:b,attempts:0,totalPct:0,best:0,worst:100,views:new Set(),lastDate:''};
    byUser[u].attempts++;
    byUser[u].totalPct+=s.pct;
    byUser[u].best=Math.max(byUser[u].best,s.pct);
    byUser[u].worst=Math.min(byUser[u].worst,s.pct);
    byUser[u].views.add(s.view);
    if(!byUser[u].lastDate||s.date>byUser[u].lastDate) byUser[u].lastDate=s.date;
  });
  const users=Object.values(byUser).map(u=>({...u,avg:Math.round(u.totalPct/u.attempts),views:[...u.views]})).sort((a,b)=>b.avg-a.avg);

  /* Per-BPO stats */
  const byBPO={};
  allScores.forEach(s=>{
    const b=s.bpo||'Unknown';
    if(!byBPO[b]) byBPO[b]={bpo:b,attempts:0,totalPct:0,users:new Set()};

  const bpos=Object.values(byBPO).map(b=>({...b,avg:Math.round(b.totalPct/b.attempts),userCount:b.users.size}));

  /* Per-user ack counts across all views */
  const allAcks = ['dms','l2rr','p1'].flatMap(v=>(S[v].acks||[]).map(a=>({...a,view:v.toUpperCase()})));
  const ackByUser={};
  allAcks.forEach(a=>{ const u=a.username||'?'; if(!ackByUser[u]) ackByUser[u]={cases:0,tips:0}; if(a.type==='case') ackByUser[u].cases++; else if(a.type==='tip') ackByUser[u].tips++; });

  const bpoColor=b=>b==='Vads'?'#EE4D2D':b==='ePerformax'?'#2563EB':b==='Asia Recruit'?'#059669':'#6B7280';

  return masterfileCard + `<div>
  <!-- Summary strip -->

    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Overall Avg</div><div style="font-size:28px;font-weight:900;color:${scoreColor(Math.round(allScores.reduce((a,s)=>a+s.pct,0)/allScores.length))}">${Math.round(allScores.reduce((a,s)=>a+s.pct,0)/allScores.length)}%</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Acknowledgements</div><div style="font-size:28px;font-weight:900;color:#059669">${allAcks.length}</div></div>
  </div>

  <!-- BPO comparison -->
  <div class="card" style="padding:20px;margin-bottom:20px">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">🏢 BPO Comparison</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${bpos.map(b=>`<div style="flex:1;min-width:140px;padding:16px;border-radius:12px;background:${bpoBg(b.bpo)};border:2px solid ${bpoColor(b.bpo)}">
        <div style="font-size:13px;font-weight:900;color:${bpoColor(b.bpo)};margin-bottom:8px">${esc(b.bpo)}</div>
        <div style="font-size:26px;font-weight:900;color:${scoreColor(b.avg)};margin-bottom:4px">${b.avg}%</div>
        <div style="font-size:11px;color:#6B7280">${b.userCount} user${b.userCount!==1?'s':''} · ${b.attempts} attempt${b.attempts!==1?'s':''}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- Per-user table -->
  <div class="card" style="padding:20px">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">👤 Per-User Breakdown</h3>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid #E5E7EB">
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">User</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">BPO</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Attempts</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Avg</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Best</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Worst</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Cases Acked</th>
          <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Tips Acked</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Views Taken</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Last Active</th>
        </tr></thead>
        <tbody>${users.map((u,i)=>`<tr style="border-bottom:1px solid #F3F4F6;background:${i%2?'#FAFAFA':'#fff'}">
          <td style="padding:10px 12px;font-weight:700">${esc(u.username)}</td>
          <td style="padding:10px 12px"><span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:${bpoBg(u.bpo)};color:${bpoColor(u.bpo)}">${esc(u.bpo)}</span></td>
          <td style="padding:10px 12px;text-align:center;font-weight:700">${u.attempts}</td>
          <td style="padding:10px 12px;text-align:center"><span style="font-weight:900;color:${scoreColor(u.avg)};background:${scoreBg(u.avg)};padding:2px 8px;border-radius:6px">${u.avg}%</span></td>
          <td style="padding:10px 12px;text-align:center;font-weight:700;color:#059669">${u.best}%</td>
          <td style="padding:10px 12px;text-align:center;font-weight:700;color:#DC2626">${u.worst}%</td>
          <td style="padding:10px 12px;text-align:center;font-weight:700;color:#059669">${(ackByUser[u.username]||{}).cases||0}</td>
          <td style="padding:10px 12px;text-align:center;font-weight:700;color:#2563EB">${(ackByUser[u.username]||{}).tips||0}</td>
          <td style="padding:10px 12px">${u.views.map(v=>`<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#F3F4F6;color:#374151;margin-right:3px">${v}</span>`).join('')}</td>
          <td style="padding:10px 12px;font-size:12px;color:#6B7280">${esc(u.lastDate)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>
  <div class="card" style="padding:20px;margin-top:0">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">✅ Acknowledgement Log</h3>
    ${allAcks.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid #E5E7EB">
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">User</th>
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">BPO</th>
        <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Type</th>
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">View</th>
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Date</th>
      </tr></thead>
      <tbody>${allAcks.slice().reverse().map((a,i)=>`<tr style="border-bottom:1px solid #F3F4F6;background:${i%2?'#FAFAFA':'#fff'}">
        <td style="padding:9px 12px;font-weight:700">${esc(a.username||'?')}</td>
        <td style="padding:9px 12px"><span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:${a.bpo==='Vads'?'#FFF5F2':a.bpo==='ePerformax'?'#EFF6FF':a.bpo==='Asia Recruit'?'#ECFDF5':'#F3F4F6'};color:${a.bpo==='Vads'?'#EE4D2D':a.bpo==='ePerformax'?'#2563EB':a.bpo==='Asia Recruit'?'#059669':'#6B7280'}">${esc(a.bpo||'—')}</span></td>
        <td style="padding:9px 12px;text-align:center"><span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:${a.type==='case'?'#FFF5F2':'#EFF6FF'};color:${a.type==='case'?'#EE4D2D':'#2563EB'}">${a.type==='case'?'📋 Case':'💡 Tip'}</span></td>
        <td style="padding:9px 12px;font-size:12px">${esc(a.view||'')}</td>
        <td style="padding:9px 12px;font-size:12px;color:#6B7280">${esc(a.date||'')}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:`<p style="font-size:13px;color:#9CA3AF;text-align:center;padding:20px 0">No acknowledgements yet.</p>`}
  </div></div>`;
}

function acknowledgeCurrentCase(){
  const c = V().sel;
  if(!c){ toast('No case selected','error'); return; }
  const id = (c.id && String(c.id).trim() && String(c.id).trim()!=='undefined') ? String(c.id).trim() : [c.week,c.returnReason,c.rcaL1].join('|');
  acknowledge('case', id);
}

function acknowledge(type, id){
  if(!_currentUsername){ showUsernameModal(''); toast('Please sign in first','error'); return; }
  const d=V();
  const already = (d.acks||[]).find(a=>a.type===type&&a.id===String(id)&&a.username===_currentUsername);
  if(already){ toast('You already acknowledged this '+type,'error'); return; }
  if(!d.acks) d.acks=[];
  d.acks.push({type,id:String(id),username:_currentUsername,bpo:_currentBPO||'',date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})});
  saveAcks();
  toast('✅ Acknowledged!');
  render();
}
function hasAcked(type, id){
  if(!_currentUsername) return false;
  const d=V();
  if(type==='case'){
    // id might be undefined/empty for cases imported from Sheets without an ID column
    // Use same fallback logic as acknowledgeCurrentCase
    const c = typeof id === 'object' ? id : null;
    const key = (id && String(id).trim() && String(id).trim()!=='undefined') ? String(id).trim() : null;
    if(!key) return false;
    return (d.acks||[]).some(a=>a.type===type&&a.id===key&&a.username===_currentUsername);
  }
  return (d.acks||[]).some(a=>a.type===type&&a.id===String(id)&&a.username===_currentUsername);
}

function rAdmTraffic(){
  const allVisits = S._visits || [];
  // Exclude filter — stored on the view-agnostic S object
  if(!S._trafficExclude) S._trafficExclude = '';
  const visits = S._trafficExclude
    ? allVisits.filter(v => (v.username||'(anonymous)') !== S._trafficExclude)
    : allVisits;

  /* ── date helpers ─────────────────────────────────────── */
  const todayStr  = new Date().toISOString().slice(0,10);
  const msPerDay  = 86400000;
  const dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Build last-14-days bucket list
  const days14 = [];
  for(let i=13;i>=0;i--){
    const d = new Date(Date.now() - i*msPerDay);
    days14.push(d.toISOString().slice(0,10));
  }

  // Count per day
  const byDay = {};
  visits.forEach(v=>{ byDay[v.day] = (byDay[v.day]||0)+1; });

  // Count per hour (all-time)
  const byHour = Array(24).fill(0);
  visits.forEach(v=>{ if(v.hour!=null) byHour[v.hour]++; });

  // Count per day-of-week (all-time)
  const byDow = Array(7).fill(0);
  visits.forEach(v=>{ if(v.dow!=null) byDow[v.dow]++; });

  /* ── summary stats ────────────────────────────────────── */
  const total     = visits.length;
  const today     = byDay[todayStr] || 0;
  const week7     = days14.slice(7).reduce((s,d)=>s+(byDay[d]||0),0);
  const maxDay    = days14.reduce((m,d)=>Math.max(m,byDay[d]||0),0);
  const peakDay   = days14.find(d=>(byDay[d]||0)===maxDay);
  const peakLabel = peakDay ? new Date(peakDay+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';

  /* ── bar chart — 14 days ──────────────────────────────── */
  function barChart(){
    if(!total) return `<div style="text-align:center;padding:40px;color:#9CA3AF;font-size:13px">No visit data yet — visits are logged automatically each session.</div>`;
    const bars = days14.map(d=>{
      const cnt = byDay[d]||0;
      const pct = maxDay>0 ? Math.round((cnt/maxDay)*100) : 0;
      const isToday = d===todayStr;
      const label = new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const barColor = isToday ? '#EE4D2D' : '#2563EB';
      const barBg    = isToday ? '#FFF5F2' : '#EFF6FF';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">
        <div style="font-size:11px;font-weight:800;color:${cnt?barColor:'#D1D5DB'}">${cnt||''}</div>
        <div style="width:100%;display:flex;align-items:flex-end;height:80px">
          <div style="width:100%;height:${Math.max(pct,cnt?4:0)}%;background:${cnt?barColor:barBg};border-radius:4px 4px 0 0;transition:height .3s;min-height:${cnt?4:0}px"></div>
        </div>
        <div style="font-size:9.5px;color:${isToday?'#EE4D2D':'#6B7280'};font-weight:${isToday?800:600};text-align:center;line-height:1.2;white-space:nowrap">${label}${isToday?'<br>TODAY':''}</div>
      </div>`;
    }).join('');
    return `<div style="display:flex;align-items:flex-end;gap:6px;padding:8px 0 0 0;height:130px">${bars}</div>`;
  }

  /* ── hour heatmap (0-23) ─────────────────────────────── */
  function hourChart(){
    const maxH = Math.max(...byHour,1);
    const cells = byHour.map((cnt,h)=>{
      const pct = Math.round((cnt/maxH)*100);
      const bg = cnt===0?'#F3F4F6':pct>75?'#1D4ED8':pct>50?'#2563EB':pct>25?'#93C5FD':'#DBEAFE';
      const tc = cnt===0?'#D1D5DB':pct>50?'#fff':'#1E40AF';
      const label = (h%3===0)?String(h).padStart(2,'0')+':00':'';
      return `<div title="${h}:00 — ${cnt} visits" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="width:100%;height:28px;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${tc}">${cnt||''}</div>
        <div style="font-size:8px;color:#9CA3AF;min-height:10px">${label}</div>
      </div>`;
    }).join('');
    return `<div style="display:flex;gap:3px;align-items:flex-start">${cells}</div>`;
  }

  /* ── day-of-week bars ────────────────────────────────── */
  function dowChart(){
    const maxDow = Math.max(...byDow,1);
    const bars = byDow.map((cnt,i)=>{
      const pct = Math.round((cnt/maxDow)*100);
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
        <div style="font-size:11px;font-weight:800;color:${cnt?'#059669':'#D1D5DB'}">${cnt||''}</div>
        <div style="width:100%;height:48px;display:flex;align-items:flex-end">
          <div style="width:100%;height:${Math.max(pct,cnt?6:0)}%;background:${cnt?'#059669':'#F3F4F6'};border-radius:4px 4px 0 0;min-height:${cnt?4:0}px"></div>
        </div>
        <div style="font-size:11px;color:#6B7280;font-weight:700">${dayLabels[i]}</div>
      </div>`;
    }).join('');
    return `<div style="display:flex;gap:8px;align-items:flex-end;height:80px">${bars}</div>`;
  }

  /* ── per-user table ──────────────────────────────────────── */
  const byUser = {};
  allVisits.forEach(v=>{
    const u = v.username || '(anonymous)';
    if(!byUser[u]) byUser[u]={ username:u, bpo:v.bpo||'—', total:0, today:0, lastSeen:'' };
    byUser[u].total++;
    if(v.day===todayStr) byUser[u].today++;
    if(!byUser[u].lastSeen||v.ts>byUser[u].lastSeen) byUser[u].lastSeen=v.ts;
  });
  const userRows = Object.values(byUser).sort((a,b)=>b.total-a.total);

  const knownUsers = ['All',...userRows.map(u=>u.username)];
  const excludeDD = `<select class="inp" style="width:auto;min-width:160px" onchange="S._trafficExclude=this.value==='All'?'':this.value;render()">
    ${knownUsers.map(u=>`<option value="${esc(u)}" ${(S._trafficExclude||'All')===u?'selected':''}>${esc(u==='All'?'Show everyone':u==='(anonymous)'?'(anonymous)':'Exclude: '+u)}</option>`).join('')}
  </select>`;

  const excludeNote = S._trafficExclude
    ? `<div class="notif" style="background:#FEF3C7;border:1px solid rgba(217,119,6,.2);margin-bottom:12px"><span style="font-size:16px">🙈</span><span style="font-size:13px;color:#92400E;font-weight:600">Excluding <b>${esc(S._trafficExclude)}</b> from all charts and counts.</span></div>`
    : '';

  return `<div>
  <!-- Filter bar -->
  <div class="card" style="padding:14px 20px;margin-bottom:12px">
    <div class="filter-row">
      <span class="filter-label">Exclude user:</span>${excludeDD}
      <span style="font-size:12px;color:#6B7280;margin-left:4px">Use this to filter out your own visits.</span>
    </div>
  </div>
  ${excludeNote}
  <!-- Summary strip -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Total Visits</div><div style="font-size:28px;font-weight:900;color:#2563EB">${total}</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Today</div><div style="font-size:28px;font-weight:900;color:#EE4D2D">${today}</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Last 7 Days</div><div style="font-size:28px;font-weight:900;color:#059669">${week7}</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Peak Day</div><div style="font-size:22px;font-weight:900;color:#D97706">${peakLabel}</div><div style="font-size:11px;font-weight:700;color:#D97706">${maxDay} visits</div></div>
  </div>

  <!-- 14-day bar chart -->
  <div class="card" style="padding:20px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="font-size:15px;font-weight:800;margin:0">📅 Last 14 Days</h3>
      <span style="font-size:11px;color:#6B7280;font-weight:600">🔴 = today</span>
    </div>
    ${barChart()}
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0">
    <!-- Hour-of-day heatmap -->
    <div class="card" style="padding:20px">

      </div>
    </div>

    <!-- Day-of-week -->
    <div class="card" style="padding:20px">
      <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">📆 Visits by Day of Week (all-time)</h3>
      ${dowChart()}
    </div>
  </div>

  <!-- Per-user breakdown -->
  <div class="card" style="padding:20px;margin-top:16px">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">👤 Visits by User</h3>
    ${userRows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid #E5E7EB">
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">User</th>
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">BPO</th>
        <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Total</th>
        <th style="text-align:center;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Today</th>
        <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">Last Seen</th>
      </tr></thead>
      <tbody>${userRows.map((u,i)=>{
        const bpoColor=u.bpo==='Vads'?'#EE4D2D':u.bpo==='ePerformax'?'#2563EB':u.bpo==='Asia Recruit'?'#059669':'#6B7280';
        const bpoBg=u.bpo==='Vads'?'#FFF5F2':u.bpo==='ePerformax'?'#EFF6FF':u.bpo==='Asia Recruit'?'#ECFDF5':'#F3F4F6';
        const lastSeen = u.lastSeen ? new Date(u.lastSeen).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
        const isExcluded = S._trafficExclude === u.username;
        return '<tr style="border-bottom:1px solid #F3F4F6;background:'+(isExcluded?'#FFFBEB':i%2?'#FAFAFA':'#fff')+'">'
          +'<td style="padding:9px 12px;font-weight:700;color:'+(u.username==='(anonymous)'?'#9CA3AF':'#111827')+'">'+esc(u.username)+'</td>'
          +'<td style="padding:9px 12px"><span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:'+bpoBg+';color:'+bpoColor+'">'+esc(u.bpo)+'</span></td>'
          +'<td style="padding:9px 12px;text-align:center;font-weight:900;color:#2563EB">'+u.total+'</td>'
          +'<td style="padding:9px 12px;text-align:center;font-weight:700;color:'+(u.today?'#EE4D2D':'#9CA3AF')+'">'+u.today+'</td>'
          +'<td style="padding:9px 12px;font-size:12px;color:#6B7280">'+lastSeen+'</td>'
          +'</tr>';
      }).join('')}</tbody>
    </table></div>`:`<p style="text-align:center;color:#9CA3AF;font-size:13px;padding:20px 0">No visits logged yet.</p>`}
  </div>
  </div>`;
}

$('file-import').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;const d=V();const target=d._importTarget;
  const r=new FileReader();r.onload=function(ev){try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);
    if(target==='cases'){d.cases=d.cases.concat(data);toast('Imported '+data.length+' case(s)');}
    else if(target==='tips'){d.tips=d.tips.concat(data.map(function(x){x.id=Date.now()+Math.random();return x;}));toast('Imported '+data.length+' tip(s)');}
    else if(target==='quiz'){data.forEach(function(x){d.customQs.push({q:x.question||x.q||'',opts:[x.option1||'',x.option2||'',x.option3||'',x.option4||''].filter(Boolean),ans:0,week:x.week||''});});toast('Imported '+data.length+' quiz q(s)');}
    render();
  }catch(err){toast('Import failed','error');}};r.readAsArrayBuffer(f);e.target.value='';
});
function exportData(target){const d=V();var data,fn;
  if(target==='cases'){data=d.cases;fn=viewNames[S.view]+'_Cases.xlsx';}
  else if(target==='tips'){data=d.tips;fn=viewNames[S.view]+'_Tips.xlsx';}
  else{data=d.customQs.map(function(q){return{question:q.q,option1:q.opts[0]||'',option2:q.opts[1]||'',option3:q.opts[2]||'',option4:q.opts[3]||'',correctAnswer:q.opts[q.ans]||'',week:q.week};});fn=viewNames[S.view]+'_Quiz.xlsx';}
  var ws=XLSX.utils.json_to_sheet(data);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');XLSX.writeFile(wb,fn);toast('Exported '+fn);}

loadScores();
loadAcks();
loadUsername();

if(!_currentUsername){
  setTimeout(function(){ showUsernameModal(''); }, 300);
}

initFirebase();
