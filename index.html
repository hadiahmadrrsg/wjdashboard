<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJ Dashboard v3</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit','Segoe UI',sans-serif;min-height:100vh;background:#F5F6F8;color:#1A1A1A;display:flex}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeUp{animation:fadeUp .35s ease both}
#sidebar{width:230px;background:#fff;border-right:1px solid #E5E7EB;padding:16px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo-row{display:flex;align-items:center;gap:10px;padding:10px 10px 20px;border-bottom:1px solid #E5E7EB;margin-bottom:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1.5px solid #E5E7EB}
.logo-title{font-size:15px;font-weight:900;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:#6B7280;font-weight:600;letter-spacing:.3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:all .2s;background:transparent;color:#6B7280}
.nav-btn.active{background:linear-gradient(135deg,#EE4D2D,#FF6B47);color:#fff;box-shadow:0 4px 15px rgba(238,77,45,.25)}
.nav-btn .icon{font-size:17px}.nav-btn .label{flex:1}
.nav-btn .count{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;background:rgba(238,77,45,.1);color:#EE4D2D}
.nav-btn.active .count{background:rgba(255,255,255,.25);color:#fff}
#main{flex:1;padding:28px 36px;overflow-y:auto;max-height:100vh}
.card{background:#fff;border-radius:16px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:24px;margin-bottom:16px}
.card-hover{transition:all .2s}.card-hover:hover{border-color:#EE4D2D;box-shadow:0 6px 24px rgba(238,77,45,.1);transform:translateY(-1px)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.btn-primary{padding:10px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,#EE4D2D,#FF6B47);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(238,77,45,.25)}
.btn-outline{padding:10px 22px;border-radius:10px;border:1.5px solid #EE4D2D;background:#fff;color:#EE4D2D;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn-edit{border:1px solid #2563EB;background:#EFF6FF;color:#2563EB}
.btn-del{border:1px solid #DC2626;background:#FEF2F2;color:#DC2626}
.btn-undo{border:1px solid #2563EB;background:#EFF6FF;color:#2563EB}
.week-hdr{padding:10px 0;margin:16px 0 10px;border-bottom:2px solid #EE4D2D;display:flex;align-items:center;gap:10px}
.week-tag{background:#EE4D2D;color:#fff;padding:4px 14px;border-radius:8px;font-size:12px;font-weight:800}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #E5E7EB;font-size:13px;font-family:inherit;outline:none;transition:border .2s}
.inp:focus{border-color:#EE4D2D;box-shadow:0 0 0 3px rgba(238,77,45,.1)}
select.inp{cursor:pointer;background:#fff}
.filter-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filter-label{font-size:12px;font-weight:700;color:#6B7280}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{padding:20px 22px}
.stat-label{font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat-val{font-size:30px;font-weight:900}
.rca-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rca-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.rca-bar{height:8px;border-radius:4px;background:#F3F4F6;overflow:hidden;margin-top:5px}
.rca-fill{height:100%;border-radius:4px}
.rca-count{font-size:22px;font-weight:900}
.quiz-opt{padding:14px 20px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;color:#1A1A1A;font-size:14px;font-weight:500;text-align:left;cursor:pointer;line-height:1.6;font-family:inherit;transition:all .15s;width:100%;margin-bottom:10px;display:block}
.quiz-opt:hover{border-color:#EE4D2D;background:#FFF5F2}
.quiz-opt.correct{border-color:#059669;background:#ECFDF5}.quiz-opt.wrong{border-color:#DC2626;background:#FEF2F2}
.quiz-opt.disabled{cursor:default}.quiz-opt.disabled:hover{border-color:#E5E7EB;background:#fff}
.notif{border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
#toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 24px;border-radius:12px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;animation:fadeUp .3s ease}
.score-detail{background:#fff;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 16px 16px;padding:16px 22px;margin-bottom:12px}
.tip-expanded{margin-top:12px;padding:14px 18px;background:#F3F4F6;border-radius:12px;font-size:14px;line-height:1.8}
.admin-q-opt{padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:6px;border:1px solid #E5E7EB}
.admin-q-opt.correct{border-color:#059669;background:#ECFDF5;font-weight:700;color:#059669}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flex-sb{display:flex;justify-content:space-between;align-items:center}
.flex-c{display:flex;align-items:center;gap:8px}
.flex-w{display:flex;flex-wrap:wrap;gap:6px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.text-center{text-align:center}.pointer{cursor:pointer}
.view-toggle{display:flex;gap:0;margin-bottom:12px;background:#F3F4F6;border-radius:12px;padding:4px}
.view-btn{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:transparent;color:#6B7280;text-align:center}
.view-btn.on{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.drop-zone{border:2px dashed #E5E7EB;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px;font-size:12px;color:#6B7280}
.drop-zone:hover,.drop-zone.drag-over{border-color:#EE4D2D;background:#FFF5F2;color:#EE4D2D}
.drop-zone img,.drop-zone video{max-width:100%;max-height:120px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo-row">
    <div class="logo-icon"><svg width="36" height="36" viewBox="0 0 120 120" fill="none"><rect width="120" height="120" fill="#fff"/><path d="M60 16c-8 0-15 4.5-18.5 11.2h37C75 20.5 68 16 60 16z" fill="#EE4D2D"/><path d="M41 26h-1.5c-.5 0-1 .1-1.4.3A27.5 27.5 0 0032 28v.5l3 56c.3 5 4.5 9 9.5 9h31c5 0 9.2-4 9.5-9l3-56V28a27 27 0 00-6-1.7c-.5-.2-1-.3-1.5-.3H79" fill="#EE4D2D"/><path d="M41.5 27.2a3.2 3.2 0 01-.3-1.3 3 3 0 013-3h.3A19 19 0 0160 13a19 19 0 0115.5 9.9h.3a3 3 0 013 3c0 .5-.1.9-.3 1.3" stroke="#EE4D2D" stroke-width="5" fill="none"/><text x="60" y="72" text-anchor="middle" fill="#fff" font-weight="900" font-size="38" font-family="Arial">S</text></svg></div>
    <div><div class="logo-title">WJ Dashboard</div><div class="logo-sub">Return and Refund</div><div id="sidebar-username" style="font-size:11px;color:#EE4D2D;font-weight:700;margin-top:2px;display:none"></div></div>
  </div>
  <div id="nav-view"></div>
  <div id="nav"></div>
  <div style="flex:1"></div>
  <div id="nav-admin"></div>
  <div id="fb-status" style="margin-top:8px;padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;background:#FEF3C7;color:#D97706;display:flex;align-items:center;gap:6px">
    <span style="width:7px;height:7px;border-radius:50%;background:#D97706;flex-shrink:0;display:inline-block"></span>
    <span id="fb-status-text">Connecting…</span>
  </div>
  <div id="fb-refresh-time" style="font-size:10px;color:#9CA3AF;margin-top:4px;padding:0 4px;display:none">Last synced: —</div>
  <div id="sheet-sync-badge" style="font-size:10px;color:#059669;font-weight:700;margin-top:4px;padding:0 4px;display:none"></div>
</div>
<div id="main"></div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".xlsx,.xls" style="display:none">
<!-- Paste JSON Modal -->
<div id="username-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center">
    <div style="font-size:48px;margin-bottom:12px">🧠</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:6px">Who's taking the quiz?</h2>
    <p style="font-size:14px;color:#6B7280;margin-bottom:20px">Enter your details so your score is saved correctly.</p>
    <input id="username-input" class="inp" placeholder="Your full name..." style="margin-bottom:12px;font-size:15px;text-align:center" onkeydown="if(event.key==='Enter')confirmUsername()">
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button id="bpo-vads" onclick="selectBPO('Vads')" style="flex:1;padding:14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;color:#6B7280">Vads</button>
      <button id="bpo-ep" onclick="selectBPO('ePerformax')" style="flex:1;padding:14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;color:#6B7280">ePerformax</button>
    </div>
    <button class="btn-primary" style="width:100%;padding:14px" onclick="confirmUsername()">Start Quiz →</button>
  </div>
</div>
<script>
/* ═══ MULTI-VIEW STATE ═══ */
function mkView(sampleCases,sampleTips,sampleQs,sampleKudos){
  return {cases:sampleCases||[],tips:sampleTips||[],customQs:sampleQs||[],scores:[],kudos:sampleKudos||[],
    sel:null,quiz:{on:false,i:0,ans:[],score:0,done:false},qList:[],
    fWeek:'All',fTopic:'All',fKeyword:'',tipCat:'All',tipWeekF:'All',tipKeyword:'',
    expandedTip:null,expandedScore:null,completedWeeks:{},
    adminSub:'cases',adminCaseWeek:'All',adminTipWeek:'All',adminQWeek:'All',
    showAddCase:false,showAddTip:false,showAddQ:false,showAddKudos:false,
    editQIdx:null,editingCase:null,editingTip:null,editingKudos:null,
    undoCases:[],undoTips:[],undoQs:[],undoKudos:[],
    _prefillCaseWeek:'',_prefillTipWeek:'',_qFormAns:0,_importTarget:'',
    _ncImgData:'',_ncVidData:'',_ntImgData:'',_ntVidData:'',
    reminder:['','','','',''],
    _reminderUndo:null,
    acks:[],  // [{type:'case'|'tip', id, username, bpo, date}]
  };
}

const S = {
  view: 'dms',
  tab: 'dashboard',
  dms: mkView([],[],[],[]),
  l2rr: mkView([],[],[],[]),
  p1: mkView([],[],[],[]),
};

/* ═══ HELPERS ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function V(){return S[S.view];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function groupByWeek(arr){const m={};arr.forEach(c=>{const w=c.week||'Unassigned';if(!m[w])m[w]=[];m[w].push(c);});return Object.entries(m);}
function uv(arr,key){return[...new Set(arr.map(a=>a[key]).filter(Boolean))];}
function countBy(arr,key){const m={};arr.forEach(a=>{const v=a[key];m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function toast(msg,type){const t=$('toast');t.textContent=msg;t.style.background=type==='error'?'#DC2626':'#059669';t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
function badge(text,color,bg){return `<span class="badge" style="color:${color};background:${bg}">${esc(text)}</span>`;}
function dd(id,value,options,ph,onchange){return `<select class="inp" style="width:auto;min-width:130px" id="${id}" onchange="${onchange}"><option value="All">${ph||'All'}</option>${options.filter(o=>o!=='All').map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function weekBtn(w,fn){return `<div style="margin-left:auto"><button style="padding:4px 12px;border-radius:6px;border:1px solid #EE4D2D;background:#FFF5F2;color:#EE4D2D;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="${fn}">+ Add to ${esc(w)}</button></div>`;}

const VER='v3';

/* ═══ USERNAME + BPO ═══ */
var _currentUsername = '';
var _currentBPO = '';

function loadUsername(){
  try{
    _currentUsername = localStorage.getItem('wj_username')||'';
    _currentBPO = localStorage.getItem('wj_bpo')||'';
  }catch(e){}
  updateSidebarUsername();
}

function updateSidebarUsername(){
  const el = document.getElementById('sidebar-username');
  if(!el) return;
  if(_currentUsername){
    const bpoColor = _currentBPO==='Vads'?'#EE4D2D':_currentBPO==='ePerformax'?'#2563EB':'#6B7280';
    el.innerHTML = '👤 '+esc(_currentUsername)+(_currentBPO?` <span style="background:${bpoColor};color:#fff;padding:1px 7px;border-radius:6px;font-size:10px;margin-left:4px">${esc(_currentBPO)}</span>`:'');
    el.style.display='block';
  } else {
    el.style.display='none';
  }
}

function selectBPO(bpo){
  _currentBPO = bpo;
  const vEl=document.getElementById('bpo-vads');
  const eEl=document.getElementById('bpo-ep');
  if(vEl) vEl.style.cssText += bpo==='Vads'?';border-color:#EE4D2D;background:#FFF5F2;color:#EE4D2D':';border-color:#E5E7EB;background:#fff;color:#6B7280';
  if(eEl) eEl.style.cssText += bpo==='ePerformax'?';border-color:#2563EB;background:#EFF6FF;color:#2563EB':';border-color:#E5E7EB;background:#fff;color:#6B7280';
}

function showUsernameModal(pendingWeek){
  const modal = document.getElementById('username-modal');
  if(modal){ modal.style.display='flex'; modal._pendingWeek=pendingWeek||''; }
  setTimeout(()=>{
    const inp=document.getElementById('username-input');
    if(inp){ inp.value=_currentUsername||''; inp.focus(); }
    if(_currentBPO) selectBPO(_currentBPO);
  },50);
}

function confirmUsername(){
  const inp = document.getElementById('username-input');
  const name = (inp?inp.value:'').trim();
  if(!name){ inp&&inp.focus(); toast('Please enter your name','error'); return; }
  if(!_currentBPO){ toast('Please select your BPO','error'); return; }
  _currentUsername = name;
  try{
    localStorage.setItem('wj_username', name);
    localStorage.setItem('wj_bpo', _currentBPO);
  }catch(e){}
  updateSidebarUsername();
  const modal = document.getElementById('username-modal');
  const pendingWeek = modal?modal._pendingWeek:'';
  if(modal) modal.style.display='none';
  _doStartQuiz(pendingWeek);
}

/* ═══ FIREBASE CONFIG — REPLACE WITH YOUR OWN ═══
   Steps:
   1. Go to https://console.firebase.google.com
   2. Create a project → Add a web app → copy the firebaseConfig object
   3. Go to Realtime Database → Create database → Start in TEST MODE
   4. Paste your values below
   ════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAB8uxu0TQlrV0LBvH7-FgWFsKxPni5Qv8",
  authDomain:        "wj-dashboard.firebaseapp.com",
  databaseURL:       "https://wj-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "wj-dashboard",
  storageBucket:     "wj-dashboard.firebasestorage.app",
  messagingSenderId: "653380094253",
  appId:             "1:653380094253:web:e2ebc39383505a1ffbaba4"
};

/* ═══ FIREBASE ENGINE ═══ */
var _fbReady = false;
var _fbDB = null;
var _fbListeners = {}; // active realtime listeners

function fbConfigured(){
  return FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('PASTE_YOUR');
}

function updateSheetSyncBadge(isoString){
  const el = document.getElementById('sheet-sync-badge');
  if(!el) return;
  try{
    const d = new Date(isoString);
    const label = d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    el.textContent = '📊 Sheet synced: '+label;
    el.style.display = 'block';
  }catch(e){}
}

function fbStatus(state){
  const el=document.getElementById('fb-status');
  const txt=document.getElementById('fb-status-text');
  const timeEl=document.getElementById('fb-refresh-time');
  if(!el||!txt)return;
  const map={ok:['#ECFDF5','#059669','🟢 Synced'],err:['#FEF2F2','#DC2626','🔴 Not connected'],warn:['#FEF3C7','#D97706','🟡 Connecting…'],local:['#F3F4F6','#6B7280','⚫ Local only']};
  const [bg,col,label]=map[state]||map.warn;
  el.style.background=bg;el.style.color=col;txt.textContent=label;
  el.querySelector('span').style.background=col;
  if(timeEl){
    if(state==='ok'){
      const now=new Date();
      const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const d=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      timeEl.textContent='Last synced: '+d+', '+t;
      timeEl.style.display='block';
    } else if(state==='local'){
      timeEl.style.display='none';
    }
  }
}

function initFirebase(){
  if(!fbConfigured()){
    console.warn('Firebase not configured — running in local-only mode.');
    fbStatus('local');
    render();
    return;
  }
  // Dynamically load Firebase SDK (compat v9)
  const sdks = [
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
  ];
  let loaded = 0;
  sdks.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => { loaded++; if(loaded === sdks.length) onFirebaseLoaded(); };
    s.onerror = () => { console.error('Failed to load Firebase SDK'); render(); };
    document.head.appendChild(s);
  });
}

function onFirebaseLoaded(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _fbDB = firebase.database();
    _fbReady = true;
    fbStatus('warn');
    loadAllFromFirebase();
  }catch(e){
    console.error('Firebase init error:', e);
    fbStatus('err');
    render();
  }
}

function fbPath(view, field){
  return 'wjdashboard/' + view + '/' + field;
}

/* Load all views from Firebase, then subscribe to live updates */
function loadAllFromFirebase(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder','scores','acks'];
  let pending = views.length * fields.length + 1; // +1 for _lastSheetSync

  function done(){ pending--; if(pending===0){ render(); fbStatus('ok'); subscribeAll(); } }

  // Read last sheet push timestamp set by Apps Script trigger
  _fbDB.ref('_lastSheetSync').once('value', snap => {
    if(snap.val()) updateSheetSyncBadge(snap.val());
    _fbDB.ref('_lastSheetSync').on('value', s => { if(s.val()) updateSheetSyncBadge(s.val()); });
    done();
  }, () => done());

  views.forEach(v => {
    fields.forEach(f => {
      _fbDB.ref(fbPath(v,f)).once('value', snap => {
        const val = snap.val();
        if(val !== null){
          if(f==='reminder'){ const a=Array.isArray(val)?val:(val?[val]:[]);while(a.length<5)a.push('');S[v].reminder=a; }
          else{ S[v][f]=Array.isArray(val)?val:Object.values(val||{}); }
        }
        done();
      }, () => done());
    });
  });
}

/* Live listeners — update state & re-render when another user changes data */
function subscribeAll(){
  const views = ['dms','l2rr','p1'];
  const fields = ['cases','tips','customQs','kudos','reminder','scores','acks'];
  views.forEach(v => {
    fields.forEach(f => {
      const key = v+':'+f;
      if(_fbListeners[key]) return; // already subscribed
      const ref = _fbDB.ref(fbPath(v, f));
      _fbListeners[key] = ref.on('value', snap => {
        const val = snap.val();
        if(f === 'reminder'){ const v5=Array.isArray(val)?val:(val?[val]:[]);while(v5.length<5)v5.push('');S[v].reminder=v5; }
        else { S[v][f] = val ? (Array.isArray(val) ? val : Object.values(val)) : []; }
        render();
      });
    });
  });
}

/* Save a single field to Firebase */
function saveToFirebase(viewKey, field){
  if(!_fbReady) return;
  const d = S[viewKey];
  const val = field === 'reminder' ? d.reminder : d[field];
  _fbDB.ref(fbPath(viewKey, field)).set(val).catch(e => console.warn('Firebase write error:', e));
}

/* Auto-save on every render — only changed view's data */
var _saveDebounce = {};
function autoSave(viewKey){
  if(!_fbReady) return;
  // Debounce 600ms to avoid writes on every keystroke
  clearTimeout(_saveDebounce[viewKey]);
  _saveDebounce[viewKey] = setTimeout(() => {
    ['cases','tips','customQs','kudos','reminder','scores','acks'].forEach(f => saveToFirebase(viewKey, f));
  }, 600);
}
const viewColors={dms:'#EE4D2D',l2rr:'#2563EB',p1:'#7C3AED'};
const viewNames={dms:'DMS',l2rr:'L2RR',p1:'P1'};

/* Quiz scores — saved to Firebase (shared) with localStorage fallback */
function saveScores(){
  if(_fbReady){
    ['dms','l2rr','p1'].forEach(v => saveToFirebase(v,'scores'));
  } else {
    try{['dms','l2rr','p1'].forEach(v=>{localStorage.setItem('wj_scores_'+v,JSON.stringify(S[v].scores));});}catch(e){}
  }
}
function loadScores(){
  // Only used as fallback when Firebase is not configured
  try{['dms','l2rr','p1'].forEach(v=>{const d=localStorage.getItem('wj_scores_'+v);if(d)S[v].scores=JSON.parse(d);});}catch(e){}
}

/* Drag-drop file helper — returns base64 data URL */
function dropZone(id,currentUrl,label){
  return `<div class="drop-zone" id="dz-${id}" onclick="$('fi-${id}').click()"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="event.preventDefault();this.classList.remove('drag-over');handleFileDrop('${id}',event.dataTransfer.files[0])">
    ${currentUrl?`<div>✅ File attached</div>${currentUrl.match(/^data:image/)?'<img src="'+currentUrl+'">':currentUrl.match(/^data:video/)?'<video src="'+currentUrl+'" style="max-height:80px"></video>':'<div style="font-size:11px;color:#059669;word-break:break-all">'+currentUrl.slice(0,60)+'...</div>'}`
    :`<div>📎 ${label||'Drag & drop or click to upload'}</div><div style="font-size:11px;margin-top:4px">Supports images & videos</div>`}
    <input type="file" id="fi-${id}" accept="image/*,video/*" style="display:none" onchange="handleFileDrop('${id}',this.files[0])">
  </div>`;
}
var _fileCallbacks={};
function handleFileDrop(id,file){if(!file)return;const r=new FileReader();r.onload=function(e){if(_fileCallbacks[id])_fileCallbacks[id](e.target.result);};r.readAsDataURL(file);}

/* Convert Google Drive share URL to direct embeddable URL */
function driveEmbed(url){
  if(!url) return '';
  // Handle /file/d/FILE_ID/view or /open?id=FILE_ID
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=view&id='+m[1];
  return url; // not a Drive URL, return as-is
}
function driveVideo(url){
  if(!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}

}
function _doStartQuiz(wf){const d=V();let qs=[];

  fc.forEach(cq=>{if(cq.q&&cq.opts.filter(Boolean).length>=2)qs.push({q:cq.q,opts:cq.opts.filter(Boolean),ans:cq.opts[cq.ans]||cq.opts[0],week:cq.week});});
  if(qs.length<4&&fca.length>=2){fca.slice(0,8-qs.length).forEach((c,i)=>{const ot=d.cases.filter((_,j)=>j!==i);const wr=ot.slice(0,2).map(o=>o.keyLesson||o.painPoint);
    qs.push({q:'Finding: "'+c.findings.slice(0,120)+'…" — Key lesson?',opts:shuffle([c.keyLesson||c.painPoint,...wr,"Escalate to supervisor"]),ans:c.keyLesson||c.painPoint,week:c.week});});}
  if(!qs.length){toast('No questions for this week','error');return;}
  qs=qs.map(q=>({...q,opts:shuffle(q.opts)}));d.qList=qs;d.quiz={on:true,i:0,ans:[],score:0,done:false,wf:wf||''};render();}

  if(last){q.done=true;if(q.wf)d.completedWeeks[q.wf]=true;d.scores.unshift({date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}),score:q.score,total:d.qList.length,pct:Math.round(q.score/d.qList.length*100),username:_currentUsername||'Unknown',bpo:_currentBPO||'',details:d.qList.map((qq,idx)=>{const a=q.ans[idx]||{};return{q:qq.q,correct:qq.ans,selected:a.sel,ok:a.ok,week:qq.week};})});saveScores();}else{q.i++;}render();}

/* ═══ SCORES ═══ */
function buildPodium(scores, bpoName, accentColor, accentBg){
  const bestByUser={};
  scores.filter(s=>(s.bpo||'')=== bpoName).forEach(s=>{
    const u=s.username||'Unknown';
    if(!bestByUser[u]||s.pct>bestByUser[u].pct) bestByUser[u]={...s,username:u};
  });
  const top3=Object.values(bestByUser).sort((a,b)=>b.pct-a.pct).slice(0,3);
  const medals=['🥇','🥈','🥉'];
  const podiumColors=['#D97706','#6B7280','#B45309'];
  const podiumBgs=['linear-gradient(135deg,#FDE68A,#FCD34D)','linear-gradient(135deg,#E5E7EB,#D1D5DB)','linear-gradient(135deg,#FCD9A0,#F59E0B)'];
  const heights=[100,130,80];
  const order=[1,0,2];

  const podiumSlots = order.map(p=>{
    const k=top3[p];
    const h=heights[p===1?0:p===0?1:2];
    if(!k) return `<div style="display:flex;flex-direction:column;align-items:center;width:96px">
      <div style="font-size:${p===0?26:20}px;margin-bottom:6px">${medals[p]}</div>
      <div style="font-size:12px;color:#D1D5DB;font-weight:700;margin-bottom:6px">—</div>
      <div style="width:100%;height:${h}px;border-radius:10px 10px 0 0;background:#F3F4F6;display:flex;align-items:center;justify-content:center">
        <span style="font-size:24px;font-weight:900;color:#E5E7EB">${p+1}</span>
      </div></div>`;
    return `<div style="display:flex;flex-direction:column;align-items:center;width:96px">
      <div style="font-size:${p===0?26:20}px;margin-bottom:4px">${medals[p]}</div>
      <div style="font-size:12px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:2px">${esc(k.username)}</div>
      <div style="font-size:18px;font-weight:900;color:${podiumColors[p]};margin-bottom:2px">${k.pct}%</div>
      <div style="font-size:10px;color:#6B7280;margin-bottom:6px">${k.score}/${k.total}</div>
      <div style="width:100%;height:${h}px;border-radius:10px 10px 0 0;background:${podiumBgs[p]};display:flex;align-items:center;justify-content:center">
        <span style="font-size:22px;font-weight:900;color:rgba(0,0,0,.12)">${p+1}</span>
      </div></div>`;
  }).join('');

  const spotsLeft = 3 - top3.length;
  return `<div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <div style="width:10px;height:10px;border-radius:50%;background:${accentColor};flex-shrink:0"></div>
      <span style="font-size:15px;font-weight:900;color:${accentColor}">${esc(bpoName)}</span>
    </div>
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:4px 0">
      ${podiumSlots}
    </div>
    ${spotsLeft>0?`<p style="font-size:11px;color:#9CA3AF;text-align:center;margin-top:8px">${spotsLeft} spot${spotsLeft!==1?'s':''} open</p>`:''}
  </div>`;
}

    return `<div class="card card-hover pointer" style="padding:16px 22px;margin-bottom:${ex?0:12}px;${ex?'border-radius:16px 16px 0 0':''}" onclick="V().expandedScore=${ex?'null':i};render()">

function rAdmUserStats(){
  /* Collect all scores across all views */
  const allScores = ['dms','l2rr','p1'].flatMap(v => (S[v].scores||[]).map(s=>({...s,view:v.toUpperCase()})));
  if(!allScores.length) return `<div class="card" style="padding:40px;text-align:center"><div style="font-size:48px;margin-bottom:12px">👥</div><h3 style="font-weight:800;margin-bottom:8px">No quiz data yet</h3><p style="color:#6B7280;font-size:13px">User stats will appear here once agents start taking quizzes.</p></div>`;

  /* Per-user stats */
  const byUser={};
  allScores.forEach(s=>{
    const u=s.username||'Unknown'; const b=s.bpo||'—';
    if(!byUser[u]) byUser[u]={username:u,bpo:b,attempts:0,totalPct:0,best:0,worst:100,views:new Set(),lastDate:''};
    byUser[u].attempts++;
    byUser[u].totalPct+=s.pct;
    byUser[u].best=Math.max(byUser[u].best,s.pct);
    byUser[u].worst=Math.min(byUser[u].worst,s.pct);
    byUser[u].views.add(s.view);
    if(!byUser[u].lastDate||s.date>byUser[u].lastDate) byUser[u].lastDate=s.date;
  });
  const users=Object.values(byUser).map(u=>({...u,avg:Math.round(u.totalPct/u.attempts),views:[...u.views]})).sort((a,b)=>b.avg-a.avg);

  /* Per-BPO stats */
  const byBPO={};
  allScores.forEach(s=>{
    const b=s.bpo||'Unknown';
    if(!byBPO[b]) byBPO[b]={bpo:b,attempts:0,totalPct:0,users:new Set()};
    byBPO[b].attempts++; byBPO[b].totalPct+=s.pct; byBPO[b].users.add(s.username||'?');
  });
  const bpos=Object.values(byBPO).map(b=>({...b,avg:Math.round(b.totalPct/b.attempts),userCount:b.users.size}));

  /* Per-user ack counts across all views */
  const allAcks = ['dms','l2rr','p1'].flatMap(v=>(S[v].acks||[]).map(a=>({...a,view:v.toUpperCase()})));
  const ackByUser={};
  allAcks.forEach(a=>{ const u=a.username||'?'; if(!ackByUser[u]) ackByUser[u]={cases:0,tips:0}; if(a.type==='case') ackByUser[u].cases++; else if(a.type==='tip') ackByUser[u].tips++; });

  const bpoColor=b=>b==='Vads'?'#EE4D2D':b==='ePerformax'?'#2563EB':'#6B7280';
  const bpoBg=b=>b==='Vads'?'#FFF5F2':b==='ePerformax'?'#EFF6FF':'#F3F4F6';
  const scoreColor=p=>p>=80?'#059669':p>=50?'#D97706':'#DC2626';
  const scoreBg=p=>p>=80?'#ECFDF5':p>=50?'#FFFBEB':'#FEF2F2';

  return `<div>
  <!-- Summary strip -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Total Users</div><div style="font-size:28px;font-weight:900;color:#2563EB">${users.length}</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Total Attempts</div><div style="font-size:28px;font-weight:900;color:#EE4D2D">${allScores.length}</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Overall Avg</div><div style="font-size:28px;font-weight:900;color:${scoreColor(Math.round(allScores.reduce((a,s)=>a+s.pct,0)/allScores.length))}">${Math.round(allScores.reduce((a,s)=>a+s.pct,0)/allScores.length)}%</div></div>
    <div class="card text-center" style="padding:16px"><div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;margin-bottom:4px">Acknowledgements</div><div style="font-size:28px;font-weight:900;color:#059669">${allAcks.length}</div></div>
  </div>

  <!-- BPO comparison -->
  <div class="card" style="padding:20px;margin-bottom:20px">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">🏢 BPO Comparison</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${bpos.map(b=>`<div style="flex:1;min-width:140px;padding:16px;border-radius:12px;background:${bpoBg(b.bpo)};border:2px solid ${bpoColor(b.bpo)}">
        <div style="font-size:13px;font-weight:900;color:${bpoColor(b.bpo)};margin-bottom:8px">${esc(b.bpo)}</div>
        <div style="font-size:26px;font-weight:900;color:${scoreColor(b.avg)};margin-bottom:4px">${b.avg}%</div>
        <div style="font-size:11px;color:#6B7280">${b.userCount} user${b.userCount!==1?'s':''} · ${b.attempts} attempt${b.attempts!==1?'s':''}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- Per-user table -->
  <div class="card" style="padding:20px">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:14px">👤 Per-User Breakdown</h3>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid #E5E7EB">
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">User</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase">BPO</th>

function rAdmReminder(){const d=V();const rm=Array.isArray(d.reminder)?[...d.reminder]:['','','','',''];while(rm.length<5)rm.push('');

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

        Reminder ${i+1} ${filled?'<span style="font-size:10px;font-weight:700;background:#ECFDF5;color:#059669;padding:1px 6px;border-radius:6px">Active</span>':'<span style="font-size:10px;color:#9CA3AF">Empty</span>'}

      <div style="display:flex;gap:6px">
        <button style="padding:5px 12px;border-radius:8px;border:none;background:#EE4D2D;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="saveOneReminder(${i})">💾 Save</button>
        <button style="padding:5px 12px;border-radius:8px;border:1.5px solid #DC2626;background:#FEF2F2;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" onclick="clearOneReminder(${i})">✕ Clear</button>
      </div>
    </div>
    <textarea class="inp" id="adm-reminder-${i}" rows="2" placeholder="Type reminder ${i+1} here…" style="margin-bottom:0;background:#fff">${esc(rm[i]||'')}</textarea>
  </div>`;}).join('')}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;padding-top:16px;border-top:1px solid #E5E7EB">
    <button class="btn-primary" onclick="saveReminder()">💾 Save All</button>
    <button style="padding:10px 20px;border-radius:10px;border:1.5px solid #DC2626;background:#FEF2F2;color:#DC2626;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit" onclick="deleteReminder()">🗑 Clear All</button>
    <button style="padding:10px 20px;border-radius:10px;border:1.5px solid #6B7280;background:#F9FAFB;color:#6B7280;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit" onclick="undoReminder()">↩ Undo</button>
  </div></div>`;
}
function acknowledge(type, id){
  if(!_currentUsername){ toast('Please take the quiz first to set your name','error'); return; }
  const d=V();
  const already = (d.acks||[]).find(a=>a.type===type&&a.id===String(id)&&a.username===_currentUsername);
  if(already){ toast('You already acknowledged this '+type,'error'); return; }
  if(!d.acks) d.acks=[];
  d.acks.push({type,id:String(id),username:_currentUsername,bpo:_currentBPO||'',date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})});
  toast('✅ Acknowledged!');
  render();
}
function hasAcked(type, id){ const d=V(); return _currentUsername&&(d.acks||[]).some(a=>a.type===type&&a.id===String(id)&&a.username===_currentUsername); }
function saveReminder(){const d=V();d._reminderUndo=[...(Array.isArray(d.reminder)?d.reminder:[])];d.reminder=[0,1,2,3,4].map(i=>{const el=$('adm-reminder-'+i);return el?el.value.trim():'';});toast('All reminders saved!');render();}
function saveOneReminder(i){const d=V();d._reminderUndo=[...(Array.isArray(d.reminder)?d.reminder:[])];const rm=Array.isArray(d.reminder)?[...d.reminder]:['','','','',''];while(rm.length<5)rm.push('');const el=$('adm-reminder-'+i);rm[i]=el?el.value.trim():'';d.reminder=rm;toast('Reminder '+(i+1)+' saved!');render();}
function clearOneReminder(i){const d=V();d._reminderUndo=[...(Array.isArray(d.reminder)?d.reminder:[])];const rm=Array.isArray(d.reminder)?[...d.reminder]:['','','','',''];while(rm.length<5)rm.push('');rm[i]='';d.reminder=rm;toast('Reminder '+(i+1)+' cleared.');render();}
function deleteReminder(){const d=V();d._reminderUndo=[...(Array.isArray(d.reminder)?d.reminder:[])];d.reminder=['','','','',''];toast('All reminders cleared.');render();}
function undoReminder(){const d=V();if(d._reminderUndo){d.reminder=d._reminderUndo;d._reminderUndo=null;toast('Reminders restored.');render();}else{toast('Nothing to undo.','error');}}

$('file-import').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;const d=V();const target=d._importTarget;
  const r=new FileReader();r.onload=function(ev){try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);
    if(target==='cases'){d.cases=d.cases.concat(data);toast('Imported '+data.length+' case(s)');}
    else if(target==='tips'){d.tips=d.tips.concat(data.map(function(x){x.id=Date.now()+Math.random();return x;}));toast('Imported '+data.length+' tip(s)');}
    else if(target==='quiz'){data.forEach(function(x){d.customQs.push({q:x.question||x.q||'',opts:[x.option1||'',x.option2||'',x.option3||'',x.option4||''].filter(Boolean),ans:0,week:x.week||''});});toast('Imported '+data.length+' quiz q(s)');}
    render();
  }catch(err){toast('Import failed','error');}};r.readAsArrayBuffer(f);e.target.value='';
});
function exportData(target){const d=V();var data,fn;
  if(target==='cases'){data=d.cases;fn=viewNames[S.view]+'_Cases.xlsx';}
  else if(target==='tips'){data=d.tips;fn=viewNames[S.view]+'_Tips.xlsx';}
  else{data=d.customQs.map(function(q){return{question:q.q,option1:q.opts[0]||'',option2:q.opts[1]||'',option3:q.opts[2]||'',option4:q.opts[3]||'',correctAnswer:q.opts[q.ans]||'',week:q.week};});fn=viewNames[S.view]+'_Quiz.xlsx';}
  var ws=XLSX.utils.json_to_sheet(data);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');XLSX.writeFile(wb,fn);toast('Exported '+fn);}
